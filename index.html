<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XK TEAM - CLOUD MANAGEMENT PANEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(243, 156, 18, 0.2);
        }
        /* Custom scrollbar biar makin rapih */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #22c55e;
            border-radius: 3px;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <div class="text-center mb-8 border-b border-yellow-600/30 pb-6">
            <h1 class="text-3xl font-bold text-yellow-500 tracking-wider">XK TEAM MULTI-DEVICE CLOUD</h1>
            <p class="text-xs text-gray-400 mt-1">DEVELOPER: Xyro Van Komalx | MODULE INTEGRATION</p>
        </div>

        <div class="glass-card rounded-xl p-6 mb-8 shadow-xl">
            <h2 class="text-lg font-semibold text-yellow-500 mb-4 flex items-center gap-2">
                <span>⚡</span> GENERATE KEY & AUTOMATIC DEVICE LIMIT
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">DEVICE LIMIT (KUOTA HP)</label>
                    <input type="number" id="modLimit" placeholder="Contoh: 2" value="1" min="1"
                        class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-sm text-yellow-400 focus:outline-none focus:border-yellow-500">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">EXPIRED DATE</label>
                    <input type="date" id="modExp" 
                        class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-sm text-yellow-400 focus:outline-none focus:border-yellow-500">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">PASSWORD ACCOUNT (OPTIONAL)</label>
                    <input type="text" id="modPass" placeholder="Kosongkan jika ingin acak" 
                        class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-sm text-yellow-400 focus:outline-none focus:border-yellow-500">
                </div>
            </div>

            <div class="mt-6">
                <button onclick="generateKeyCloud()" 
                    class="w-full bg-yellow-600 hover:bg-yellow-500 text-gray-900 font-bold p-3 rounded text-sm tracking-widest transition duration-200 shadow-lg shadow-yellow-600/20">
                    🔥 CREATE KEY & LOCK STATUS
                </button>
            </div>
        </div>

        <div class="glass-card rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold text-yellow-500 mb-4 flex items-center gap-2">
                <span>📁</span> CLOUD KEY DATABASE MONITORING
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-gray-400 bg-gray-900/50">
                            <th class="p-3">KEY LISENSI</th>
                            <th class="p-3">LIMIT SLOT HP</th>
                            <th class="p-3">LIST HP TERDAFTAR (ANDROID ID)</th>
                            <th class="p-3">PASSWORD</th>
                            <th class="p-3">EXPIRED DATE</th>
                            <th class="p-3">STATUS ACCESS</th>
                        </tr>
                    </thead>
                    <tbody id="keyTableBody">
                        <tr>
                            <td colspan="6" class="p-4 text-center text-gray-500">Memuat database dari Firebase...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // URL Realtime Database Firebase Milik Tuan Vanx
        const DB_URL = "https://module-database-d76ed-default-rtdb.firebaseio.com/";

        // 1. FUNGSI UTAMA GENERATE KEY OTOMATIS KE FIREBASE
        async function generateKeyCloud() {
            const limitInput = document.getElementById('modLimit').value;
            const expInput = document.getElementById('modExp').value;
            const passInput = document.getElementById('modPass').value.trim();

            // Validasi Input Wajib
            if (!limitInput || !expInput) {
                alert("❌ Kuota Limit Device dan Tanggal Expired wajib diisi!");
                return;
            }

            // Membuat kode KEY otomatis acak berawalan XK (Contoh: XK-JARA3M)
            const generatedKey = "XK-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            
            // Membuat password acak jika dikosongkan oleh Tuan
            let finalPassword = passInput;
            if (finalPassword === "") {
                finalPassword = Math.random().toString(36).substring(2, 7).toUpperCase();
            }

            // STRUKTUR PAYLOAD JSON YANG OTOMATIS MENYETEL DATA
            const payload = {
                device_limit: parseInt(limitInput).toString(), // Menyimpan kuota limit (Contoh: "1" atau "2")
                expired: expInput,                             // Menyimpan tanggal expired
                key: generatedKey,                             // Menyimpan kode key utama
                password: finalPassword,                       // Menyimpan password
                status: "active",                              // Otomatis langsung aktif
                registered_devices: ""                         // Dikosongkan, untuk diisi otomatis oleh HP pembeli nanti
            };

            // Menyimpan data langsung di bawah folder KEY-nya (users/KEY_CODE)
            const targetUrl = `${DB_URL}users/${generatedKey}.json`;

            try {
                const response = await fetch(targetUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert(`✨ KEY BERHASIL DICETAK & DISIMPAN! ✨\n\n🔑 KEY : ${generatedKey}\n👥 LIMIT: ${limitInput} Device\n🔒 PASS : ${finalPassword}`);
                    
                    // Reset Form Input
                    document.getElementById('modExp').value = '';
                    document.getElementById('modPass').value = '';
                    
                    // Refresh data tabel monitoring
                    loadKeys();
                } else {
                    alert("❌ Gagal menyimpan data! Periksa Aturan (Rules) Firebase Tuan.");
                }
            } catch (error) {
                alert("❌ Terjadi kesalahan jaringan: " + error.message);
            }
        }

        // 2. FUNGSI UNTUK MEMBACA DATABASE & MENAMPILKAN KE TABEL MONITORING
        async function loadKeys() {
            const tableBody = document.getElementById('keyTableBody');
            const fetchUrl = `${DB_URL}users.json`;

            try {
                const response = await fetch(fetchUrl);
                const data = await response.json();

                if (!data || data === 'null') {
                    tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Belum ada key yang terdaftar di cloud.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = ''; // Hapus pesan memuat data

                // Lakukan looping membaca data per Key
                Object.keys(data).forEach(keyId => {
                    const item = data[keyId];
                    
                    // Hitung jumlah perangkat yang sudah terdaftar otomatis di key ini
                    const registeredList = item.registered_devices ? Object.keys(item.registered_devices).join(', ') : 'Belum ada HP login';
                    const usedCount = item.registered_devices ? Object.keys(item.registered_devices).length : 0;
                    
                    const row = document.createElement('tr');
                    row.className = "border-b border-gray-800/60 hover:bg-gray-900/30 text-gray-300 transition";
                    
                    row.innerHTML = `
                        <td class="p-3 font-bold text-yellow-500 font-mono">${keyId}</td>
                        <td class="p-3 text-blue-400 font-bold">${usedCount} / ${item.device_limit || '1'}</td>
                        <td class="p-3 text-xs text-gray-400 font-mono max-w-xs truncate" title="${registeredList}">${registeredList}</td>
                        <td class="p-3 font-mono text-gray-400">${item.password || '-'}</td>
                        <td class="p-3 text-red-400 font-bold">${item.expired || '-'}</td>
                        <td class="p-3">
                            <span class="px-2 py-0.5 rounded text-[10px] ${item.status === 'active' ? 'bg-green-900/50 text-green-400 border border-green-600/30' : 'bg-red-900/50 text-red-400 border border-red-600/30'}">
                                ${(item.status || 'INACTIVE').toUpperCase()}
                            </span>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-400">Gagal sinkronisasi data: ${error.message}</td></tr>`;
            }
        }

        // Jalankan pemuatan data otomatis saat halaman admin diakses
        window.onload = loadKeys;
    </script>
</body>
</html>
