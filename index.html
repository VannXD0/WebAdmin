<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>XK TEAM ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000000; /* Hitam polos dulu biar aman dari bug layout */
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .admin-panel {
            max-width: 560px;
            width: 100%;
            background: rgba(20, 20, 20, 0.9);
            border-radius: 2rem;
            padding: 1.5rem;
            border: 1px solid rgba(188,19,254,0.4);
            box-shadow: 0 0 35px rgba(188,19,254,0.25);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(188,19,254,0.3);
            padding-bottom: 0.8rem;
        }
        .header h1 {
            font-family: 'Orbitron';
            font-size: 1.3rem;
            color: white;
            text-shadow: 0 0 6px #bc13fe;
            letter-spacing: 1px;
        }
        
        .logout-btn {
            background: #ff4d4d; border: none; padding: 6px 16px; border-radius: 40px;
            color: white; font-weight: bold; cursor: pointer; font-size: 0.7rem;
        }

        .tabs { display: flex; gap: 12px; margin-bottom: 1.8rem; }
        .tab-btn {
            flex: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(188,19,254,0.5);
            padding: 11px 0; border-radius: 40px; color: #ddd; font-weight: bold;
            text-align: center; cursor: pointer; font-family: 'Orbitron'; font-size: 0.8rem;
        }
        .tab-btn.active {
            background: #bc13fe; color: white; box-shadow: 0 0 12px #bc13fe; border-color: #bc13fe;
        }

        .content-pane { display: none; }
        .content-pane.active { display: block; }

        label { color: #fff; font-size: 0.7rem; font-weight: 500; display: block; margin-top: 14px; letter-spacing: 0.5px; }
        input, select {
            width: 100%; padding: 11px 14px; background: rgba(0,0,0,0.65);
            border: 1px solid rgba(188,19,254,0.5); border-radius: 30px; color: white;
            margin-top: 5px; outline: none; font-size: 0.85rem;
        }
        .custom-limit-container { display: none; margin-top: 5px; }

        .gen-btn {
            width: 100%; margin-top: 25px; background: linear-gradient(95deg, #6a0dad, #bc13fe);
            border: none; padding: 12px; border-radius: 40px; color: white;
            font-weight: bold; cursor: pointer; font-size: 0.9rem;
        }

        .member-card {
            background: rgba(0,0,0,0.65); border: 1px solid rgba(188,19,254,0.3);
            border-radius: 16px; padding: 14px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .member-info { color: #ddd; font-size: 0.75rem; line-height: 1.6; }
        .member-info b { color: white; font-size: 0.85rem; }
        
        .type-badge { font-weight: bold; font-family: 'Orbitron'; margin-right: 4px; }
        .type-mod { color: #38bdf8; }
        .type-apk { color: #f43f5e; }

        .tier-badge {
            padding: 2px 8px; border-radius: 20px; font-size: 0.65rem; font-weight: bold;
            margin-left: 6px; text-transform: uppercase; border: 1px solid currentColor;
            background: rgba(0,0,0,0.4); display: inline-block;
        }
        .tier-basic { color: #a1a1aa; } .tier-ultra { color: #06b6d4; }
        .tier-vixo { color: #10b981; } .tier-delta { color: #f97316; }
        .tier-sonic { color: #eab308; } .tier-lunar { color: #e2e8f0; }
        .tier-athena { color: #ef4444; } .tier-privet { color: #f59e0b; }

        .member-actions { display: flex; gap: 10px; font-weight: bold; font-size: 0.7rem; font-family: 'Orbitron'; }
        .action-edit { color: #facc15; cursor: pointer; padding: 4px 8px; border-radius: 4px; background: rgba(250,204,21,0.1); }
        .action-delete { color: #ff4d4d; cursor: pointer; padding: 4px 8px; border-radius: 4px; background: rgba(255,77,77,0.1); }
        
        .result-msg { margin-top: 12px; color: #a3e635; font-size: 0.7rem; text-align: center; font-weight: bold; }
        .refresh-btn {
            background: #bc13fe; border: none; padding: 10px; border-radius: 30px;
            color: white; margin-bottom: 15px; cursor: pointer; width: 100%; font-size: 0.75rem; font-weight: bold;
        }
    </style>
</head>
<body>
<div class="admin-panel">
    <div class="header">
        <h1>XK TEAM ADMIN</h1>
        <button class="logout-btn" onclick="prosesLogout()">LOGOUT</button>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" id="btn-tab-module" onclick="pindahTab('module')">MODULE</button>
        <button class="tab-btn" id="btn-tab-apk" onclick="pindahTab('apk')">APK</button>
        <button class="tab-btn" id="btn-tab-members" onclick="pindahTab('members')">MEMBERS</button>
    </div>

    <div id="module-pane" class="content-pane active">
        <label>DEVICE ID</label>
        <input type="text" id="modId" placeholder="Android ID Buyer...">
        <label>EXPIRED DATE</label>
        <input type="date" id="modExp">
        <label>DEVICE LIMIT</label>
        <select id="modLimitSelect" onchange="cekCustomLimit('mod')">
            <option value="1">1 DEVICE</option>
            <option value="2">2 DEVICE</option>
            <option value="3">3 DEVICE</option>
            <option value="4">4 DEVICE</option>
            <option value="5">5 DEVICE</option>
            <option value="custom">Custom (angka)</option>
        </select>
        <div id="modCustomContainer" class="custom-limit-container">
            <label>Custom Device Limit</label>
            <input type="number" id="modCustomLimit" min="1" max="999" value="1">
        </div>
        <button class="gen-btn" onclick="aksiGenModule()">GENERATE MODULE</button>
        <div id="modResult" class="result-msg"></div>
    </div>

    <div id="apk-pane" class="content-pane">
        <label>USERNAME APK</label>
        <input type="text" id="apkUser" placeholder="Buat Username...">
        <label>PASSWORD (kosong = auto)</label>
        <input type="text" id="apkPass" placeholder="Password (opsional)">
        <label>TIER AKUN</label>
        <select id="apkTier">
            <option value="basic">Basic</option>
            <option value="ultra">Ultra</option>
            <option value="vixo">Vixo</option>
            <option value="delta">Delta</option>
            <option value="sonic">Sonic</option>
            <option value="lunar">Lunar</option>
            <option value="athena">Athena</option>
            <option value="privet">Athena Privet</option>
        </select>
        <label>DEVICE LIMIT</label>
        <select id="apkLimitSelect" onchange="cekCustomLimit('apk')">
            <option value="1">1 DEVICE</option>
            <option value="2">2 DEVICE</option>
            <option value="3">3 DEVICE</option>
            <option value="4">4 DEVICE</option>
            <option value="5">5 DEVICE</option>
            <option value="custom">Custom (angka)</option>
        </select>
        <div id="apkCustomContainer" class="custom-limit-container">
            <label>Custom Device Limit</label>
            <input type="number" id="apkCustomLimit" min="1" max="999" value="1">
        </div>
        <label>EXPIRED DATE</label>
        <input type="date" id="apkExp">
        <button class="gen-btn" onclick="aksiGenApk()">ADD APK ACCESS</button>
        <div id="apkResult" class="result-msg"></div>
    </div>

    <div id="members-pane" class="content-pane">
        <button class="refresh-btn" onclick="loadMembers()">REFRESH MEMBERS</button>
        <div id="memberList">Loading Database...</div>
    </div>
</div>

<div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:rgb(20, 25, 35); border-radius:24px; padding:25px; width:90%; max-width:400px; border:1px solid #bc13fe;">
        <h3 style="color:white; font-family:'Orbitron'; font-size:1.1rem; margin-bottom:10px;" id="modalTitle">Edit Member</h3>
        <input type="hidden" id="editType">
        <label>Target ID / Username</label>
        <input type="text" id="editUser" readonly style="background:rgba(255,255,255,0.05); color:#aaa;">
        <label>Key Akses</label>
        <input type="text" id="editKey">
        <div id="apkEditFields" style="display:none;">
            <label>Password</label>
            <input type="text" id="editPass">
            <label>Tier Akun</label>
            <select id="editTier">
                <option value="basic">Basic</option>
                <option value="ultra">Ultra</option>
                <option value="vixo">Vixo</option>
                <option value="delta">Delta</option>
                <option value="sonic">Sonic</option>
                <option value="lunar">Lunar</option>
                <option value="athena">Athena</option>
                <option value="privet">Athena Privet</option>
            </select>
        </div>
        <label>Expired Date</label>
        <input type="date" id="editExp">
        <label>Device Limit</label>
        <input type="number" id="editLimit" min="1" max="999">
        <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:25px;">
            <button onclick="simpanEditData()" style="background:linear-gradient(95deg, #6a0dad, #bc13fe); border:none; padding:10px 24px; border-radius:30px; color:white; font-weight:bold; cursor:pointer;">SAVE</button>
            <button onclick="tutupModalEdit()" style="background:#ff4d4d; border:none; padding:10px 24px; border-radius:30px; color:white; font-weight:bold; cursor:pointer;">CANCEL</button>
        </div>
    </div>
</div>

<script>
    // URL DATABASE FIREBASE
    const DB_URL = "https://module-database-d76ed-default-rtdb.firebaseio.com/";

    // 1. FUNGSI PERALIHAN TAB (LANGSUNG JALAN TANPA ADDEVENTLISTENER)
    function pindahTab(namaTab) {
        // Sembunyikan semua pane
        document.getElementById('module-pane').classList.remove('active');
        document.getElementById('apk-pane').classList.remove('active');
        document.getElementById('members-pane').classList.remove('active');

        // Hilangkan status aktif di semua tombol tab
        document.getElementById('btn-tab-module').classList.remove('active');
        document.getElementById('btn-tab-apk').classList.remove('active');
        document.getElementById('btn-tab-members').classList.remove('active');

        // Aktifkan yang dipilih
        document.getElementById(namaTab + '-pane').classList.add('active');
        document.getElementById('btn-tab-' + namaTab).classList.add('active');

        if (namaTab === 'members') {
            loadMembers();
        }
    }

    // 2. LOGOUT
    function prosesLogout() {
        localStorage.removeItem('admin_logged_in');
        window.location.href = 'login.html';
    }

    // 3. CEK DROPDOWN LIMIT CUSTOM
    function cekCustomLimit(tipe) {
        const selectEl = document.getElementById(tipe + 'LimitSelect');
        const containerEl = document.getElementById(tipe + 'CustomContainer');
        if (selectEl && containerEl) {
            containerEl.style.display = (selectEl.value === 'custom') ? 'block' : 'none';
        }
    }

    function cetakPesan(idEl, teks) {
        const el = document.getElementById(idEl);
        if (el) { el.innerHTML = teks; setTimeout(() => { el.innerHTML = ''; }, 4000); }
    }

    function bersihkanTeks(str) {
        if (!str) return '';
        return str.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 4. GENERATE MODULE DATA
    async function aksiGenModule() {
        const id = document.getElementById('modId').value.trim();
        const exp = document.getElementById('modExp').value;
        const selectVal = document.getElementById('modLimitSelect').value;
        let limit = parseInt(selectVal);
        
        if (selectVal === 'custom') {
            limit = parseInt(document.getElementById('modCustomLimit').value);
        }
        
        if (!id || !exp || isNaN(limit)) { alert('Lengkapi data Device ID dan Expired Date!'); return; }
        
        const key = "XK-" + Math.random().toString(36).substring(2,8).toUpperCase();
        try {
            await fetch(`${DB_URL}users/${id}.json`, { 
                method: 'PUT', 
                body: JSON.stringify({ key, expired: exp, device_limit: limit, status: "active" }) 
            });
            cetakPesan('modResult', `✅ MODULE BERHASIL DIBUAT! KEY: ${key}`);
            document.getElementById('modId').value = '';
        } catch(e) { alert('Gagal menyambung ke Database!'); }
    }

    // 5. GENERATE APK DATA
    async function aksiGenApk() {
        const username = document.getElementById('apkUser').value.trim();
        let password = document.getElementById('apkPass').value.trim();
        const exp = document.getElementById('apkExp').value;
        const tier = document.getElementById('apkTier').value;
        const selectVal = document.getElementById('apkLimitSelect').value;
        let limit = parseInt(selectVal);

        if (selectVal === 'custom') {
            limit = parseInt(document.getElementById('apkCustomLimit').value);
        }

        if (!username || !exp || isNaN(limit)) { alert('Lengkapi data Username dan Expired!'); return; }
        if (password === "") password = Math.random().toString(36).substring(2,8).toUpperCase();
        
        const key = "APK-" + Math.random().toString(36).substring(2,8).toUpperCase();
        try {
            await fetch(`${DB_URL}apk_access/${username}.json`, { 
                method: 'PUT', 
                body: JSON.stringify({ key, password, expired: exp, device_limit: limit, tier, status: "active" }) 
            });
            cetakPesan('apkResult', `✅ APK BERHASIL DITAMBAH!<br>KEY: ${key}<br>PASS: ${password}`);
            document.getElementById('apkUser').value = '';
            document.getElementById('apkPass').value = '';
        } catch(e) { alert('Gagal menyambung ke Database!'); }
    }

    // 6. AMBIL DATA DARI FIREBASE DAN TAMPILKAN
    async function loadMembers() {
        const container = document.getElementById('memberList');
        container.innerHTML = '<div style="color:white; text-align:center;">Memuat Database Firebase...</div>';
        try {
            const res = await fetch(`${DB_URL}.json`);
            const data = await res.json();
            container.innerHTML = '';
            let adaData = false;

            // Render Group Module
            if (data && data.users) {
                for (let id in data.users) {
                    adaData = true;
                    const obj = data.users[id];
                    const card = document.createElement('div');
                    card.className = 'member-card';
                    card.innerHTML = `
                        <div class="member-info">
                            <span class="type-badge type-mod">[MODULE]</span> <b>${bersihkanTeks(id)}</b><br>
                            🔑 KEY: ${bersihkanTeks(obj.key || '-')}<br>
                            📅 EXP: ${bersihkanTeks(obj.expired || '-')} | 📱 LIMIT: ${bersihkanTeks(obj.device_limit || '1')}
                        </div>
                        <div class="member-actions">
                            <span class="action-edit" onclick="bukaModalEdit('users', '${id}')">EDIT</span>
                            <span class="action-delete" onclick="hapusMember('users', '${id}')">HAPUS</span>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }

            // Render Group APK
            if (data && data.apk_access) {
                for (let id in data.apk_access) {
                    adaData = true;
                    const obj = data.apk_access[id];
                    const tName = obj.tier || 'basic';
                    const card = document.createElement('div');
                    card.className = 'member-card';
                    card.innerHTML = `
                        <div class="member-info">
                            <span class="type-badge type-apk">[APK]</span> <b>${bersihkanTeks(id)}</b>
                            <span class="tier-badge tier-${tName}">${tName}</span><br>
                            🔑 KEY: ${bersihkanTeks(obj.key || '-')} | 🔒 PASS: ${bersihkanTeks(obj.password || '-')}<br>
                            📅 EXP: ${bersihkanTeks(obj.expired || '-')} | 📱 LIMIT: ${bersihkanTeks(obj.device_limit || '1')}
                        </div>
                        <div class="member-actions">
                            <span class="action-edit" onclick="bukaModalEdit('apk_access', '${id}')">EDIT</span>
                            <span class="action-delete" onclick="hapusMember('apk_access', '${id}')">HAPUS</span>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }

            if (!adaData) container.innerHTML = '<div style="color:#aaa; text-align:center;">Database kosong atau belum ada member.</div>';
            
        } catch(e) { container.innerHTML = '<div style="color:#ff4d4d; text-align:center;">Gagal Terhubung ke Firebase API!</div>'; }
    }

    // 7. EDIT DATA MEMBER VIA MODAL
    async function bukaModalEdit(type, id) {
        try {
            const res = await fetch(`${DB_URL}${type}/${id}.json`);
            const obj = await res.json();
            if(!obj) return;

            document.getElementById('editType').value = type;
            document.getElementById('editUser').value = id;
            document.getElementById('editKey').value = obj.key || '';
            document.getElementById('editExp').value = obj.expired || '';
            document.getElementById('editLimit').value = obj.device_limit || '1';
            
            const apkFields = document.getElementById('apkEditFields');
            if(type === 'apk_access') {
                apkFields.style.display = 'block';
                document.getElementById('editPass').value = obj.password || '';
                document.getElementById('editTier').value = obj.tier || 'basic';
                document.getElementById('modalTitle').innerText = "Edit APK Access";
            } else {
                apkFields.style.display = 'none';
                document.getElementById('modalTitle').innerText = "Edit Module Member";
            }
            document.getElementById('editModal').style.display = 'flex';
        } catch(e) { alert('Gagal memuat detail data member!'); }
    }

    function tutupModalEdit() {
        document.getElementById('editModal').style.display = 'none';
    }

    async function simpanEditData() {
        const type = document.getElementById('editType').value;
        const id = document.getElementById('editUser').value;
        const key = document.getElementById('editKey').value.trim();
        const expired = document.getElementById('editExp').value;
        const device_limit = parseInt(document.getElementById('editLimit').value) || 1;
        
        let data = { key, expired, device_limit, status: "active" };
        if (type === 'apk_access') {
            da
