<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XK TEAM CLOUD - FIXED CLICK ABLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --accent-purple: #bc13fe; 
            --t-basic: #a1a1aa;
            --t-ultra: #00e5ff;
            --t-vixo: #00e676;
            --t-delta: #ff6d00;
            --t-sonic: #ffd600;
            --t-lunar: #ffffff;
            --t-athena: #ff1744;
            --t-private: #ffab00;
        }
        
        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100%;
            font-family: 'Poppins', sans-serif;
            display: flex; align-items: center; justify-content: center;
            background-image: url('garou.png'); 
            background-size: cover; background-position: center;
            background-attachment: fixed; background-color: #000;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.1); z-index: -1;
        }

        .lightning-border {
            width: 92%; max-width: 420px;
            z-index: 10;
        }

        .glass-container { 
            position: relative;
            background: rgba(15, 5, 25, 0.55); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 25px; border-radius: 20px; 
            border: 1px solid rgba(188, 19, 254, 0.4);
            text-align: center;
            z-index: 20;
        }

        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { font-family: 'Orbitron'; color: #fff; text-shadow: 0 0 10px var(--accent-purple); font-size: 16px; margin: 0; pointer-events: none; }
        
        .logout-link {
            background: rgba(255, 77, 77, 0.1); border: 1px solid #ff4d4d; padding: 6px 14px; border-radius: 20px;
            color: #ff4d4d; font-weight: bold; cursor: pointer; font-size: 8px; font-family: 'Orbitron';
            text-decoration: none; outline: none;
        }

        .tab-menu { display: flex; gap: 5px; margin-bottom: 15px; position: relative; z-index: 30; }
        .tab-btn {
            flex: 1; padding: 12px; border: 1px solid var(--accent-purple);
            background: rgba(0, 0, 0, 0.6); color: #fff; border-radius: 8px;
            cursor: pointer; font-family: 'Orbitron'; font-size: 9px;
            transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active { background: var(--accent-purple); box-shadow: 0 0 15px var(--accent-purple); }

        .form-section { display: none; text-align: left; }
        .form-section.active { display: block; }

        label { color: #fff; font-size: 10px; font-weight: bold; display: block; margin-top: 10px; }
        input, select { 
            width: 100%; padding: 12px; margin: 5px 0 15px 0; border-radius: 8px; 
            border: 1px solid rgba(188, 19, 254, 0.5); 
            background: rgba(0, 0, 0, 0.7); color: #fff; box-sizing: border-box; outline: none;
            font-size: 12px;
        }
        .custom-limit-box { display: none; }

        .gen-btn { 
            width: 100%; padding: 15px; background: var(--accent-purple);
            color: white; border: none; border-radius: 8px; 
            font-family: 'Orbitron'; font-weight: bold; cursor: pointer;
            z-index: 30; position: relative; margin-top: 5px;
        }

        .member-card {
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(188, 19, 254, 0.3);
            border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            position: relative; z-index: 30;
        }
        .member-card.selected { border-color: var(--accent-purple); background: rgba(188, 19, 254, 0.15); }
        .member-info b { color: #fff; font-size: 12px; }
        .member-info p { margin: 0; font-size: 9px; color: #ddd; }
        
        .badge-tier { 
            font-size: 7.5px; padding: 1px 6px; border-radius: 10px; border: 1px solid currentColor; 
            font-weight: 700; font-family: 'Orbitron'; margin-left: 5px; text-transform: uppercase; 
            display: inline-block; background: rgba(0,0,0,0.6);
        }
        .t-basic { color: var(--t-basic) !important; text-shadow: 0 0 5px var(--t-basic); } 
        .t-ultra { color: var(--t-ultra) !important; text-shadow: 0 0 5px var(--t-ultra); } 
        .t-vixo { color: var(--t-vixo) !important; text-shadow: 0 0 5px var(--t-vixo); } 
        .t-delta { color: var(--t-delta) !important; text-shadow: 0 0 5px var(--t-delta); } 
        .t-sonic { color: var(--t-sonic) !important; text-shadow: 0 0 5px var(--t-sonic); } 
        .t-lunar { color: var(--t-lunar) !important; text-shadow: 0 0 5px var(--t-lunar); } 
        .t-athena { color: var(--t-athena) !important; text-shadow: 0 0 5px var(--t-athena); } 
        .t-private { color: var(--t-private) !important; text-shadow: 0 0 5px var(--t-private); }

        .action-controls { display: none; gap: 10px; }
        .member-card.selected .action-controls { display: flex; }
        .icon-btn { cursor: pointer; font-size: 14px; padding: 5px; }
        .icon-edit { color: #facc15; } .icon-trash { color: #ff4d4d; }

        #memberList::-webkit-scrollbar { width: 4px; }
        #memberList::-webkit-scrollbar-thumb { background: var(--accent-purple); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="lightning-border">
        <div class="glass-container">
            <div class="header-area">
                <h2>XK TEAM CLOUD</h2>
                <button class="logout-link" id="btn-logout-panel">LOGOUT</button>
            </div>
            
            <div class="tab-menu">
                <button class="tab-btn active" id="btn-module" onclick="openTab('module')">MODULE</button>
                <button class="tab-btn" id="btn-apk" onclick="openTab('apk')">APK</button>
                <button class="tab-btn" id="btn-members" onclick="openTab('members'); loadMembers();">MEMBERS</button>
            </div>

            <div id="module" class="form-section active">
                <label>DEVICE ID</label>
                <input type="text" id="modId" placeholder="Android ID Buyer...">
                <label>EXPIRED DATE</label>
                <input type="date" id="modExp">
                <label>DEVICE LIMIT</label>
                <select id="modLimit" onchange="toggleCustomLimit('mod')">
                    <option value="1">1 DEVICE</option>
                    <option value="2">2 DEVICE</option>
                    <option value="5">5 DEVICE</option>
                    <option value="custom">CUSTOM LIMIT</option>
                </select>
                <div id="modCustomDiv" class="custom-limit-box">
                    <label>INPUT CUSTOM LIMIT</label>
                    <input type="number" id="modCustomLimit" value="1" min="1">
                </div>
                <button class="gen-btn" onclick="generate('module')">GENERATE MODULE</button>
            </div>

            <div id="apk" class="form-section">
                <label>USERNAME APK</label>
                <input type="text" id="apkId" placeholder="Buat Username...">
                <label>PASSWORD (Kosong = Auto)</label>
                <input type="text" id="apkPass" placeholder="Password akun...">
                <label>TIER AKUN</label>
                <select id="apkTier">
                    <option value="basic">Basic</option>
                    <option value="ultra">Ultra</option>
                    <option value="vixo">Vixo</option>
                    <option value="delta">Delta</option>
                    <option value="sonic">Sonic</option>
                    <option value="lunar">Lunar</option>
                    <option value="athena">Athena</option>
                    <option value="private">Private</option>
                </select>
                <label>DEVICE LIMIT</label>
                <select id="apkLimit" onchange="toggleCustomLimit('apk')">
                    <option value="1">1 DEVICE</option>
                    <option value="2">2 DEVICE</option>
                    <option value="5">5 DEVICE</option>
                    <option value="custom">CUSTOM LIMIT</option>
                </select>
                <div id="apkCustomDiv" class="custom-limit-box">
                    <label>INPUT CUSTOM LIMIT</label>
                    <input type="number" id="apkCustomLimit" value="1" min="1">
                </div>
                <label>EXPIRED DATE</label>
                <input type="date" id="apkExp">
                <button class="gen-btn" onclick="generate('apk')">ADD APK ACCESS</button>
            </div>

            <div id="members" class="form-section">
                <div id="memberList" style="max-height: 300px; overflow-y: auto; padding-right: 5px;"></div>
            </div>

            <div id="result" style="display:none; margin-top:15px; color:#00ff00; font-family:'Orbitron'; font-size:12px; font-weight:bold;"></div>
        </div>
    </div>

    <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99999; align-items:center; justify-content:center;">
        <div style="background:#12071f; border-radius:15px; padding:22px; width:85%; max-width:360px; border:1px solid #bc13fe; text-align: left;">
            <h3 style="color:white; font-family:'Orbitron'; font-weight:700; font-size:13px; margin:0 0 15px 0; text-align:center;" id="modalTitle">EDIT ACCESS</h3>
            <input type="hidden" id="editType">
            <input type="hidden" id="editTargetId">
            
            <label>ACCESS KEY</label>
            <input type="text" id="editKey">
            
            <div id="apkEditOnly" style="display:none;">
                <label>PASSWORD</label>
                <input type="text" id="editPass">
                <label>TIER AKUN</label>
                <select id="editTier">
                    <option value="basic">Basic</option>
                    <option value="ultra">Ultra</option>
                    <option value="vixo">Vixo</option>
                    <option value="delta">Delta</option>
                    <option value="sonic">Sonic</option>
                    <option value="lunar">Lunar</option>
                    <option value="athena">Athena</option>
                    <option value="private">Private</option>
                </select>
            </div>
            
            <label>EXPIRED DATE</label>
            <input type="date" id="editExp">
            <label>DEVICE LIMIT</label>
            <input type="number" id="editLimit" min="1">
            
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button onclick="saveEdit()" style="flex:1; background:#bc13fe; color:white; border:none; padding:11px; border-radius:6px; font-weight:700; cursor:pointer; font-family:'Orbitron'; font-size:10.5px;">SAVE</button>
                <button onclick="closeModal()" style="flex:1; background:#ff4d4d; color:white; border:none; padding:11px; border-radius:6px; font-weight:700; cursor:pointer; font-family:'Orbitron'; font-size:10.5px;">CANCEL</button>
            </div>
        </div>
    </div>

<script>
    const DB_URL = "https://module-database-d76ed-default-rtdb.firebaseio.com/";

    document.addEventListener("DOMContentLoaded", () => {
        const btnLogout = document.getElementById('btn-logout-panel');
        if(btnLogout) {
            btnLogout.addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.clear();
                sessionStorage.clear();
                window.location.replace('login.html');
            });
        }
    });

    function openTab(name) {
        document.querySelectorAll('.form-section').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(name).style.display = 'block';
        if(event && event.currentTarget) {
            event.currentTarget.classList.add('active');
        }
        document.getElementById('result').style.display = 'none';
    }

    function toggleCustomLimit(type) {
        const selectVal = document.getElementById(type + 'Limit').value;
        const divBox = document.getElementById(type + 'CustomDiv');
        if(divBox) divBox.style.display = (selectVal === 'custom') ? 'block' : 'none';
    }

    async function generate(type) {
        const idInput = type === 'module' ? 'modId' : 'apkId';
        const expInput = type === 'module' ? 'modExp' : 'apkExp';
        
        const id = document.getElementById(idInput).value.trim();
        const exp = document.getElementById(expInput).value;
        
        if(!id || !exp) { alert("Harap isi semua kolom!"); return; }

        let limitVal = "1";
        if (type === 'module') {
            const choose = document.getElementById('modLimit').value;
            limitVal = choose === 'custom' ? document.getElementById('modCustomLimit').value : choose;
        } else {
            const choose = document.getElementById('apkLimit').value;
            limitVal = choose === 'custom' ? document.getElementById('apkCustomLimit').value : choose;
        }

        const key = type === 'module' ? "XK-" + Math.random().toString(36).substring(2, 8).toUpperCase() : "APK-" + Math.random().toString(36).substring(2, 8).toUpperCase();
        const path = type === 'module' ? `users/${id}` : `apk_access/${id}`;
        
        const data = { 
            key: key, 
            expired: exp,
            status: "active",
            device_limit: limitVal
        };

        if (type === 'apk') {
            let pass = document.getElementById('apkPass').value.trim();
            if (pass === "") pass = Math.random().toString(36).substring(2, 7).toUpperCase();
            data.password = pass;
            data.tier = document.getElementById('apkTier').value;
        }
        
        try {
            await fetch(`${DB_URL}${path}.json`, { method: 'PUT', body: JSON.stringify(data) });
            
            const resDiv = document.getElementById('result');
            resDiv.style.display = 'block';
            resDiv.innerText = "DONE! KEY: " + key;

            let dialogPesan = "";
            if(type === 'module') {
                dialogPesan = `✨ SUCCESS GENERATE LICENSE ✨\n\n📌 TYPE: MODULE SYSTEM\n👤 ID BUYER: ${id}\n🔑 KEY: ${key}\n📅 EXPIRED: ${exp}\n🔒 LIMIT: ${limitVal} DEVICE\n\nLisensi berhasil disinkronisasi ke Cloud!`;
            } else {
                dialogPesan = `✨ SUCCESS GENERATE LICENSE ✨\n\n📌 TYPE: APK ACCESS\n👤 USERNAME: ${id}\n🔑 KEY/TOKEN: ${key}\n🔐 PASSWORD: ${data.password}\n🎖️ TIER: ${data.tier.toUpperCase()}\n📅 EXPIRED: ${exp}\n🔒 LIMIT: ${limitVal} DEVICE\n\nData akses APK berhasil ditambahkan!`;
            }
            
            alert(dialogPesan);

            document.getElementById(idInput).value = '';
            document.getElementById(expInput).value = '';
            if(type === 'apk') document.getElementById('apkPass').value = '';
            
        } catch(e) { 
            alert("Database Error! Gagal menembak lisensi."); 
        }
    }

    async function loadMembers() {
        const listDiv = document.getElementById('memberList');
        listDiv.innerHTML = '<p style="text-align:center; color:#fff; font-size:10px;">Loading data...</p>';
        
        try {
            const res = await fetch(`${DB_URL}.json`);
            const data = await res.json();
            listDiv.innerHTML = '';

            const render = (obj, type) => {
                for (let id in obj) {
                    const card = document.createElement('div');
                    card.className = 'member-card';
                    card.onclick = () => {
                        document.querySelectorAll('.member-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                    };
                    
                    const isMod = type === 'users';
                    const labelBadge = isMod ? '<b style="color:#38bdf8;">[MOD]</b>' : '<b style="color:#f43f5e;">[APK]</b>';
                    const devLimit = obj[id].device_limit || '1';
                    
                    const currentTier = obj[id].tier || 'basic';
                    const tierHTML = isMod ? '' : `<span class="badge-tier t-${currentTier}">${currentTier}</span>`;
                    const passHTML = isMod ? '' : ` | PASS: ${obj[id].password || '-'}`;

                    card.innerHTML = `
                        <div class="member-info">
                            <b>${labelBadge} ${id}</b> ${tierHTML}
                            <p>KEY: ${obj[id].key || '-'} ${passHTML}</p>
                            <p style="font-size:8px; color:#aaa;">LIMIT: ${devLimit} DEVICE | EXP: ${obj[id].expired || '-'}</p>
                        </div>
                        <div class="action-controls">
                            <div class="icon-btn icon-edit" onclick="openEditModal(event, '${type}', '${id}')">
                                <i class="fas fa-edit"></i>
                            </div>
                            <div class="icon-btn icon-trash" onclick="deleteMember(event, '${type}', '${id}')">
                                <i class="fas fa-trash-alt"></i>
                            </div>
                        </div>`;
                    listDiv.appendChild(card);
                }
            };

            if (data && data.users) render(data.users, 'users');
            if (data && data.apk_access) render(data.apk_access, 'apk_access');
            
            if ((!data || !data.users) && (!data || !data.apk_access)) {
                listDiv.innerHTML = '<p style="text-align:center; color:#aaa; font-size:10px;">Database Kosong.</p>';
            }
        } catch (e) { 
            listDiv.innerHTML = '<p style="color:red; text-align:center; font-size:10px;">Failed sync. Cek Firebase Rules Tuan!</p>'; 
        }
    }

    async function deleteMember(event, type, id) {
        event.stopPropagation();
        if(confirm(`Hapus akses ${id}?`)) {
            await fetch(`${DB_URL}${type}/${id}.json`, { method: 'DELETE' });
            loadMembers();
        }
    }

    async function openEditModal(event, type, id) {
        event.stopPropagation();
        try {
            const res = await fetch(`${DB_URL}${type}/${id}.json`);
            const obj = await res.json();
            if(!obj) return;

            document.getElementById('editType').value = type;
            document.getElementById('editTargetId').value = id;
            document.getElementById('editKey').value = obj.key || '';
            document.getElementById('editExp').value = obj.expired || '';
            document.getElementById('editLimit').value = obj.device_limit || '1';

            const apkOnlySection = document.getElementById('apkEditOnly');
            if (type === 'apk_access') {
                apkOnlySection.style.display = 'block';
                document.getElementById('editPass').value = obj.password || '';
                document.getElementById('editTier').value = obj.tier || 'basic';
                document.getElementById('modalTitle').innerText = "EDIT APK ACCESS";
            } else {
                apkOnlySection.style.display = 'none';
