<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>XK TEAM CLOUD - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-image: url('garou.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        /* efek overlay biru animasi (glow) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(59,130,246,0.15), transparent 70%);
            pointer-events: none;
            animation: pulseBlue 6s infinite alternate;
            z-index: 0;
        }
        @keyframes pulseBlue {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }
        .admin-panel {
            max-width: 550px;
            width: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            border: 1px solid rgba(59,130,246,0.6);
            box-shadow: 0 0 25px rgba(59,130,246,0.3);
            position: relative;
            z-index: 10;
            transition: 0.3s;
        }
        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
        }
        .logout-btn {
            background: #ff4d4d;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: 'Poppins';
            transition: 0.2s;
            z-index: 20;
        }
        .logout-btn:hover {
            background: #ff1a1a;
            transform: scale(0.97);
        }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .tab-btn {
            flex: 1;
            background: rgba(0,0,0,0.6);
            border: 1px solid #3b82f6;
            padding: 10px;
            border-radius: 40px;
            color: #ccc;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            font-family: 'Orbitron';
            font-size: 0.8rem;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 0 12px #3b82f6;
            border-color: #3b82f6;
        }
        .content-pane {
            display: none;
        }
        .content-pane.active {
            display: block;
        }
        label {
            color: #fff;
            font-size: 0.75rem;
            font-weight: 500;
            display: block;
            margin-top: 14px;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #3b82f6;
            border-radius: 30px;
            color: white;
            margin-top: 5px;
            outline: none;
            font-size: 0.85rem;
        }
        .custom-limit-container {
            display: none;
            margin-top: 5px;
        }
        .gen-btn {
            width: 100%;
            margin-top: 25px;
            background: linear-gradient(95deg, #1e3a8a, #3b82f6);
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .gen-btn:hover {
            background: linear-gradient(95deg, #2563eb, #60a5fa);
            transform: scale(0.98);
        }
        .member-card {
            background: rgba(0,0,0,0.7);
            border: 1px solid #3b82f6;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            transition: 0.1s;
        }
        .member-info {
            color: #ddd;
            font-size: 0.75rem;
        }
        .member-info b {
            color: white;
            font-size: 0.8rem;
        }
        .device-list {
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 12px;
            margin: 8px 0;
        }
        .device-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            padding: 4px 0;
        }
        .del-device {
            color: #ff8888;
            cursor: pointer;
        }
        .member-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }
        .member-actions i {
            cursor: pointer;
            font-size: 1rem;
        }
        .fa-pen { color: #facc15; }
        .fa-trash { color: #ff4d4d; }
        .result-msg {
            margin-top: 12px;
            color: #4ade80;
            font-size: 0.7rem;
            text-align: center;
        }
        .tier-badge {
            background: rgba(59,130,246,0.3);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            margin-left: 6px;
        }
        .refresh-btn {
            background: #3b82f6;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            margin-bottom: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 0.7rem;
        }
        /* Animasi tambahan */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .content-pane.active {
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body>
<div class="admin-panel">
    <div class="header">
        <button class="logout-btn" id="logoutBtn">LOGOUT</button>
    </div>
    <div class="tabs">
        <div class="tab-btn active" data-tab="module">MODULE</div>
        <div class="tab-btn" data-tab="apk">APK</div>
        <div class="tab-btn" data-tab="members">MEMBERS</div>
    </div>

    <!-- MODULE PANEL -->
    <div id="module-pane" class="content-pane active">
        <label>DEVICE ID</label>
        <input type="text" id="modId" placeholder="Android ID Buyer...">
        <label>EXPIRED DATE</label>
        <input type="date" id="modExp">
        <label>DEVICE LIMIT</label>
        <select id="modLimitSelect">
            <option value="1">1 DEVICE</option>
            <option value="2">2 DEVICE</option>
            <option value="3">3 DEVICE</option>
            <option value="4">4 DEVICE</option>
            <option value="5">5 DEVICE</option>
            <option value="custom">Custom (angka)</option>
        </select>
        <div id="modCustomContainer" class="custom-limit-container">
            <label>Custom Limit</label>
            <input type="number" id="modCustomLimit" min="1" max="999" value="1">
        </div>
        <button class="gen-btn" id="genModuleBtn">GENERATE MODULE</button>
        <div id="modResult" class="result-msg"></div>
    </div>

    <!-- APK PANEL -->
    <div id="apk-pane" class="content-pane">
        <label>USERNAME APK</label>
        <input type="text" id="apkUser" placeholder="Buat Username...">
        <label>PASSWORD (kosong = auto)</label>
        <input type="text" id="apkPass" placeholder="Password (opsional)">
        <label>TIER AKUN</label>
        <select id="apkTier">
            <option>Basic</option><option>Ultra</option><option>Vixo</option><option>Delta</option>
            <option>Sonic</option><option>Lunar</option><option>Athena</option><option>Privet</option>
        </select>
        <label>DEVICE LIMIT</label>
        <select id="apkLimitSelect">
            <option value="1">1 DEVICE</option>
            <option value="2">2 DEVICE</option>
            <option value="3">3 DEVICE</option>
            <option value="4">4 DEVICE</option>
            <option value="5">5 DEVICE</option>
            <option value="custom">Custom (angka)</option>
        </select>
        <div id="apkCustomContainer" class="custom-limit-container">
            <label>Custom Limit</label>
            <input type="number" id="apkCustomLimit" min="1" max="999" value="1">
        </div>
        <label>EXPIRED DATE</label>
        <input type="date" id="apkExp">
        <button class="gen-btn" id="genApkBtn">ADD APK ACCESS</button>
        <div id="apkResult" class="result-msg"></div>
    </div>

    <!-- MEMBERS PANEL -->
    <div id="members-pane" class="content-pane">
        <button class="refresh-btn" id="refreshMembersBtn"><i class="fas fa-sync-alt"></i> Refresh Members</button>
        <div id="memberList">Loading members...</div>
    </div>
</div>

<!-- MODAL EDIT -->
<div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1001; align-items:center; justify-content:center;">
    <div style="background:#0f1a2f; border-radius:24px; padding:20px; width:90%; max-width:380px; border:1px solid #3b82f6;">
        <h3 style="color:white;">Edit Member</h3>
        <label>Username</label>
        <input type="text" id="editUser" readonly style="background:#1e2a3a;">
        <label>Key</label>
        <input type="text" id="editKey">
        <label id="editPassLabel" style="display:none;">Password (APK)</label>
        <input type="text" id="editPass" style="display:none;">
        <label id="editTierLabel" style="display:none;">Tier (APK)</label>
        <select id="editTier" style="display:none;">
            <option>Basic</option><option>Ultra</option><option>Vixo</option><option>Delta</option>
            <option>Sonic</option><option>Lunar</option><option>Athena</option><option>Privet</option>
        </select>
        <label>Expired Date</label>
        <input type="date" id="editExp">
        <label>Device Limit</label>
        <select id="editLimit">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option><option value="999">UNLIMITED</option>
        </select>
        <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:20px;">
            <button id="saveEditBtn" style="background:#3b82f6; border:none; padding:8px 20px; border-radius:30px; color:white;">Save</button>
            <button id="closeModalBtn" style="background:#ff4d4d; border:none; padding:8px 20px; border-radius:30px; color:white;">Cancel</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // LOGIN CHECK
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
            return;
        }
        const logout = document.getElementById('logoutBtn');
        if(logout) logout.addEventListener('click', () => {
            localStorage.removeItem('admin_logged_in');
            window.location.href = 'login.html';
        });

        const DB_URL = "https://module-database-d76ed-default-rtdb.firebaseio.com/";

        // ========== TAB ==========
        const tabs = document.querySelectorAll('.tab-btn');
        const panes = {
            module: document.getElementById('module-pane'),
            apk: document.getElementById('apk-pane'),
            members: document.getElementById('members-pane')
        };
        function activateTab(tabId) {
            Object.values(panes).forEach(p => p.classList.remove('active'));
            panes[tabId].classList.add('active');
            tabs.forEach(btn => {
                if (btn.getAttribute('data-tab') === tabId) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (tabId === 'members') loadMembers();
        }
        tabs.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const tab = this.getAttribute('data-tab');
                if (tab) activateTab(tab);
            });
        });

        // Custom limit handlers
        const modSelect = document.getElementById('modLimitSelect');
        const modCustomDiv = document.getElementById('modCustomContainer');
        if(modSelect) {
            modSelect.addEventListener('change', () => {
                modCustomDiv.style.display = modSelect.value === 'custom' ? 'block' : 'none';
            });
            modCustomDiv.style.display = 'none';
        }
        const apkSelect = document.getElementById('apkLimitSelect');
        const apkCustomDiv = document.getElementById('apkCustomContainer');
        if(apkSelect) {
            apkSelect.addEventListener('change', () => {
                apkCustomDiv.style.display = apkSelect.value === 'custom' ? 'block' : 'none';
            });
            apkCustomDiv.style.display = 'none';
        }

        function showResult(elId, msg) {
            const el = document.getElementById(elId);
            if(el) { el.innerHTML = msg; setTimeout(() => el.innerHTML = '', 4000); }
        }

        // GENERATE MODULE
        const genModule = document.getElementById('genModuleBtn');
        if(genModule) {
            genModule.addEventListener('click', async () => {
                const id = document.getElementById('modId').value.trim();
                const exp = document.getElementById('modExp').value;
                let limit = parseInt(modSelect.value);
                if(modSelect.value === 'custom') {
                    let custom = parseInt(document.getElementById('modCustomLimit').value);
                    if(isNaN(custom) || custom < 1) { alert('Custom limit harus angka positif'); return; }
                    limit = custom;
                }
                if(!id || !exp) { alert('Isi Device ID dan Expired!'); return; }
                const key = "XK-" + Math.random().toString(36).substring(2,8).toUpperCase();
                const data = { key, expired: exp, device_limit: limit, status: "active" };
                try {
                    await fetch(`${DB_URL}users/${id}.json`, { method: 'PUT', body: JSON.stringify(data) });
                    showResult('modResult', `✅ DONE! KEY: ${key}`);
                    if(panes.members.classList.contains('active')) loadMembers();
                } catch(e) { alert('DB error'); }
            });
        }

        // GENERATE APK
        const genApk = document.getElementById('genApkBtn');
        if(genApk) {
            genApk.addEventListener('click', async () => {
                const username = document.getElementById('apkUser').value.trim();
                let password = document.getElementById('apkPass').value.trim();
                const exp = document.getElementById('apkExp').value;
                const tier = document.getElementById('apkTier').value;
                let limit = parseInt(apkSelect.value);
                if(apkSelect.value === 'custom') {
                    let custom = parseInt(document.getElementById('apkCustomLimit').value);
                    if(isNaN(custom) || custom < 1) { alert('Custom limit harus angka positif'); return; }
                    limit = custom;
                }
                if(!username || !exp) { alert('Isi Username dan Expired!'); return; }
                if(password === "") password = Math.random().toString(36).substring(2,8).toUpperCase();
                const key = "APK-" + Math.random().toString(36).substring(2,8).toUpperCase();
                const data = { key, password, expired: exp, device_limit: limit, tier, devices: {}, status: "active" };
                try {
                    await fetch(`${DB_URL}apk_access/${username}.json`, { method: 'PUT', body: JSON.stringify(data) });
                    showResult('apkResult', `✅ DONE!<br>🔑 KEY: ${key}<br>🔒 PASS: ${password}<br>🏷️ TIER: ${tier}<br>📱 LIMIT: ${limit}`);
                    if(panes.members.classList.contains('active')) loadMembers();
                } catch(e) { alert('DB error'); }
            });
        }

        // LOAD MEMBERS (users + apk_access)
        async function loadMembers() {
            const container = document.getElementById('memberList');
            if(!container) return;
            container.innerHTML = '<div style="color:white;">Loading members...</div>';
            try {
                const res = await fetch(`${DB_URL}.json`);
                const data = await res.json();
                container.innerHTML = '';
                let any = false;
                // users
                if(data.users && typeof data.users === 'object') {
                    for(let id in data.users) {
                        any = true;
                        const obj = data.users[id];
                        const card = document.createElement('div');
                        card.className = 'member-card';
                        card.innerHTML = `
                            <div class="member-info">
                                <b>🔧 ${escapeHtml(id)} (MODULE)</b><br>
                                🔑 KEY: ${escapeHtml(obj.key || '-')}<br>
                                📅 EXP: ${escapeHtml(obj.expired || '-')} | 📱 LIMIT: ${escapeHtml(obj.device_limit || '-')}
                            </div>
                            <div class="member-actions">
                                <i class="fas fa-pen" data-type="users" data-id="${escapeHtml(id)}" data-edit></i>
                                <i class="fas fa-trash" data-type="users" data-id="${escapeHtml(id)}" data-del></i>
                            </div>
                        `;
                        container.appendChild(card);
                    }
                }
                // apk_access
                if(data.apk_access && typeof data.apk_access === 'object') {
                    for(let id in data.apk_access) {
                        any = true;
                        const obj = data.apk_access[id];
                        let devicesHtml = '<div class="device-list"><strong>📱 Registered devices:</strong>';
                        if(obj.devices && Object.keys(obj.devices).length) {
                            for(let dev in obj.devices) {
                                devicesHtml += `<div class="device-item"><span>${escapeHtml(dev)}</span><span class="del-device" data-key="${escapeHtml(id)}" data-device="${escapeHtml(dev)}">🗑️</span></div>`;
                            }
                        } else { devicesHtml += '<div><em>No devices</em></div>'; }
                        devicesHtml += '</div>';
                        card.innerHTML = `
                            <div class="member-info">
                                <b>📱 ${escapeHtml(id)} (APK)</b> <span class="tier-badge">${escapeHtml(obj.tier || 'Basic')}</span><br>
                                🔑 KEY: ${escapeHtml(obj.key || '-')}<br>
                                ${obj.password ? `🔒 PASS: ${escapeHtml(obj.password)}<br>` : ''}
