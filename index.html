<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>XK TEAM ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('garou.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 30%, rgba(188,19,254,0.25), transparent 70%);
            pointer-events: none;
            animation: pulsePurple 5s infinite alternate;
            z-index: 0;
        }
        @keyframes pulsePurple {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }
        .admin-panel {
            max-width: 560px;
            width: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.5rem;
            border: 1px solid rgba(188,19,254,0.6);
            box-shadow: 0 0 25px rgba(188,19,254,0.4);
            position: relative;
            z-index: 10;
            transition: 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(188,19,254,0.4);
            padding-bottom: 0.8rem;
        }
        .header h1 {
            font-family: 'Orbitron';
            font-size: 1.3rem;
            color: white;
            text-shadow: 0 0 6px #bc13fe;
            letter-spacing: 1px;
        }
        .header h1 i {
            color: #bc13fe;
            margin-right: 6px;
        }
        .logout-btn {
            background: #ff4d4d;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .logout-btn:hover {
            background: #cc0000;
            transform: scale(0.96);
        }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 1.8rem;
        }
        .tab-btn {
            flex: 1;
            background: rgba(0,0,0,0.6);
            border: 1px solid #bc13fe;
            padding: 10px 0;
            border-radius: 40px;
            color: #ddd;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            font-family: 'Orbitron';
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #bc13fe;
            color: white;
            box-shadow: 0 0 12px #bc13fe;
            border-color: #bc13fe;
        }
        .content-pane {
            display: none;
        }
        .content-pane.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        label {
            color: #fff;
            font-size: 0.7rem;
            font-weight: 500;
            display: block;
            margin-top: 14px;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #bc13fe;
            border-radius: 30px;
            color: white;
            margin-top: 5px;
            outline: none;
            font-size: 0.85rem;
        }
        .custom-limit-container {
            display: none;
            margin-top: 5px;
        }
        .gen-btn {
            width: 100%;
            margin-top: 25px;
            background: linear-gradient(95deg, #6a0dad, #bc13fe);
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .gen-btn:hover {
            background: linear-gradient(95deg, #7c0dbf, #d43dff);
            transform: scale(0.98);
        }
        .member-card {
            background: rgba(0,0,0,0.7);
            border: 1px solid #bc13fe;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .member-info {
            color: #ddd;
            font-size: 0.75rem;
        }
        .member-info b {
            color: white;
            font-size: 0.8rem;
        }
        .result-msg {
            margin-top: 12px;
            color: #a3e635;
            font-size: 0.7rem;
            text-align: center;
        }
        .tier-badge {
            background: rgba(188,19,254,0.3);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            margin-left: 6px;
        }
        .refresh-btn {
            background: #bc13fe;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            margin-bottom: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 0.7rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="admin-panel">
    <div class="header">
        <h1><i class="fas fa-shield-alt"></i> XK TEAM ADMIN</h1>
        <button class="logout-btn" id="logoutBtn">LOGOUT</button>
    </div>
    <div class="tabs">
        <div class="tab-btn active" data-tab="module">MODULE</div>
        <div class="tab-btn" data-tab="apk">APK</div>
        <div class="tab-btn" data-tab="members">MEMBERS</div>
    </div>

    <div id="module-pane" class="content-pane active">
        <label>DEVICE ID</label>
        <input type="text" id="modId" placeholder="Android ID Buyer...">
        <label>EXPIRED DATE</label>
        <input type="date" id="modExp">
        <label>DEVICE LIMIT</label>
        <select id="modLimitSelect">
            <option value="1">1 DEVICE</option>
            <option value="2">2 DEVICE</option>
            <option value="3">3 DEVICE</option>
            <option value="4">4 DEVICE</option>
            <option value="5">5 DEVICE</option>
            <option value="custom">Custom (angka)</option>
        </select>
        <div id="modCustomContainer" class="custom-limit-container">
            <label>Custom Device Limit</label>
            <input type="number" id="modCustomLimit" min="1" max="999" value="1">
        </div>
        <button class="gen-btn" id="genModuleBtn">GENERATE MODULE</button>
        <div id="modResult" class="result-msg"></div>
    </div>

    <div id="apk-pane" class="content-pane">
        <label>USERNAME APK</label>
        <input type="text" id="apkUser" placeholder="Buat Username...">
        <label>PASSWORD (kosong = auto)</label>
        <input type="text" id="apkPass" placeholder="Password (opsional)">
        <label>TIER AKUN</label>
        <select id="apkTier">
            <option>Basic</option><option>Ultra</option><option>Vixo</option><option>Delta</option>
            <option>Sonic</option><option>Lunar</option><option>Athena</option><option>Privet</option>
        </select>
        <label>DEVICE LIMIT</label>
        <select id="apkLimitSelect">
            <option value="1">1 DEVICE</option>
            <option value="2">2 DEVICE</option>
            <option value="3">3 DEVICE</option>
            <option value="4">4 DEVICE</option>
            <option value="5">5 DEVICE</option>
            <option value="custom">Custom (angka)</option>
        </select>
        <div id="apkCustomContainer" class="custom-limit-container">
            <label>Custom Device Limit</label>
            <input type="number" id="apkCustomLimit" min="1" max="999" value="1">
        </div>
        <label>EXPIRED DATE</label>
        <input type="date" id="apkExp">
        <button class="gen-btn" id="genApkBtn">ADD APK ACCESS</button>
        <div id="apkResult" class="result-msg"></div>
    </div>

    <div id="members-pane" class="content-pane">
        <button class="refresh-btn" id="refreshMembersBtn"><i class="fas fa-sync-alt"></i> Refresh Members</button>
        <div id="memberList">Loading members...</div>
    </div>
</div>

<script>
    (function() {
        // ========== LOGIN CHECK ==========
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
            return;
        }

        // LOGOUT
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('admin_logged_in');
                window.location.href = 'login.html';
            });
        }

        const DB_URL = "https://module-database-d76ed-default-rtdb.firebaseio.com/";

        // ========== TAB SWITCHING ==========
        const tabBtns = document.querySelectorAll('.tab-btn');
        const panes = {
            module: document.getElementById('module-pane'),
            apk: document.getElementById('apk-pane'),
            members: document.getElementById('members-pane')
        };

        function activateTab(tabId) {
            Object.values(panes).forEach(pane => {
                if (pane) pane.classList.remove('active');
            });
            const activePane = panes[tabId];
            if (activePane) activePane.classList.add('active');
            
            tabBtns.forEach(btn => {
                if (btn.getAttribute('data-tab') === tabId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            if (tabId === 'members') {
                loadMembers();
            }
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const tab = this.getAttribute('data-tab');
                if (tab) activateTab(tab);
            });
        });

        // ========== CUSTOM LIMIT HANDLERS ==========
        const modSelect = document.getElementById('modLimitSelect');
        const modCustomDiv = document.getElementById('modCustomContainer');
        if (modSelect) {
            modSelect.addEventListener('change', () => {
                modCustomDiv.style.display = modSelect.value === 'custom' ? 'block' : 'none';
            });
        }
        const apkSelect = document.getElementById('apkLimitSelect');
        const apkCustomDiv = document.getElementById('apkCustomContainer');
        if (apkSelect) {
            apkSelect.addEventListener('change', () => {
                apkCustomDiv.style.display = apkSelect.value === 'custom' ? 'block' : 'none';
            });
        }

        function showResult(elId, msg) {
            const el = document.getElementById(elId);
            if (el) {
                el.innerHTML = msg;
                setTimeout(() => { if (el.innerHTML === msg) el.innerHTML = ''; }, 4000);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // ========== GENERATE MODULE ==========
        const genModule = document.getElementById('genModuleBtn');
        if (genModule) {
            genModule.addEventListener('click', async () => {
                const id = document.getElementById('modId').value.trim();
                const exp = document.getElementById('modExp').value;
                let limit = parseInt(modSelect.value);
                if (modSelect.value === 'custom') {
                    let custom = parseInt(document.getElementById('modCustomLimit').value);
                    if (isNaN(custom) || custom < 1) { alert('Custom limit harus angka positif'); return; }
                    limit = custom;
                }
                if (!id || !exp) { alert('Isi Device ID dan Expired!'); return; }
                const key = "XK-" + Math.random().toString(36).substring(2,8).toUpperCase();
                const data = { key, expired: exp, device_limit: limit, status: "active" };
                try {
                    await fetch(`${DB_URL}users/${id}.json`, { method: 'PUT', body: JSON.stringify(data) });
                    showResult('modResult', `✅ DONE! KEY: ${key}`);
                    document.getElementById('modId').value = '';
                } catch(e) { alert('Database error!'); }
            });
        }

        // ========== GENERATE APK ==========
        const genApk = document.getElementById('genApkBtn');
        if (genApk) {
            genApk.addEventListener('click', async () => {
                const username = document.getElementById('apkUser').value.trim();
                let password = document.getElementById('apkPass').value.trim();
                const exp = document.getElementById('apkExp').value;
                const tier = document.getElementById('apkTier').value;
                let limit = parseInt(apkSelect.value);
                if (apkSelect.value === 'custom') {
                    let custom = parseInt(document.getElementById('apkCustomLimit').value);
                    if (isNaN(custom) || custom < 1) { alert('Custom limit harus angka positif'); return; }
                    limit = custom;
                }
                if (!username || !exp) { alert('Isi Username dan Expired!'); return; }
                if (password === "") password = Math.random().toString(36).substring(2,8).toUpperCase();
                const key = "APK-" + Math.random().toString(36).substring(2,8).toUpperCase();
                const data = { key, password, expired: exp, device_limit: limit, tier, status: "active" };
                try {
                    await fetch(`${DB_URL}apk_access/${username}.json`, { method: 'PUT', body: JSON.stringify(data) });
                    showResult('apkResult', `✅ DONE!<br>🔑 KEY: ${key}<br>🔒 PASS: ${password}`);
                    document.getElementById('apkUser').value = '';
                    document.getElementById('apkPass').value = '';
                } catch(e) { alert('Database error!'); }
            });
        }

        // ========== REFRESH BUTTON ==========
        const refreshBtn = document.getElementById('refreshMembersBtn');
        if (refreshBtn) {
            refreshBtn.addEventListener('click', loadMembers);
        }

        // ========== LOAD MEMBERS ==========
        async function loadMembers() {
            const container = document.getElementById('memberList');
            if (!container) return;
            container.innerHTML = '<div style="color:white;">Loading members...</div>';
            try {
                const res = await fetch(`${DB_URL}.json`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                container.innerHTML = '';
                let any = false;

                if (data && data.users) {
                    for (let id in data.users) {
                        any = true;
                        const obj = data.users[id];
                        const card = document.createElement('div');
                        card.className = 'member-card';
                        card.innerHTML = `
                            <div class="member-info">
                                <b>🔧 ${escapeHtml(id)} (MODULE)</b><br>
                                🔑 KEY: ${escapeHtml(obj.key || '-')}<br>
                                📅 EXP: ${escapeHtml(obj.expired || '-')} | 📱 LIMIT: ${escapeHtml(obj.device_limit || '1')}
                            </div>
                        `;
                        container.appendChild(card);
                    }
                }

                if (data && data.apk_access) {
                    for (let id in data.apk_access) {
                        any = true;
                        const obj = data.apk_access[id];
                        const card = document.createElement('div');
                        card.className = 'member-card';
                        card.innerHTML = `
                            <div class="member-info">
                                <b>📱 ${escapeHtml(id)} (APK) <span class="tier-badge">${escapeHtml(obj.tier || 'Basic')}</span></b><br>
                                🔑 KEY: ${escapeHtml(obj.key || '-')} | 🔒 PASS: ${escapeHtml(obj.password || '-')}<br>
                                📅 EXP: ${escapeHtml(obj.expired || '-')} | 📱 LIMIT: ${escapeHtml(obj.device_limit || '1')}
                            </div>
                        `;
                        container.appendChild(card);
                    }
                }

                if (!any) {
                    container.innerHTML = '<div style="color:#aaa; text-align:center; font-size:0.8rem;">Tidak ada member aktif.</div>';
                }
            } catch(e) {
                container.innerHTML = '<div style="color:#ff4d4d;">Gagal memuat database!</div>';
            }
        }
    })();
</script>
</body>
</html>
