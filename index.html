<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>XK TEAM CLOUD - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('garou.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        /* Panel utama — style solid seperti gambar */
        .admin-panel {
            max-width: 550px;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #bc13fe;
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #bc13fe;
            padding-bottom: 10px;
        }
        .header h2 {
            font-family: 'Orbitron';
            color: #fff;
            text-shadow: 0 0 5px #bc13fe;
            font-size: 1.3rem;
        }
        .logout-btn {
            background: #ff4d4d;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            background: #111;
            border: 1px solid #bc13fe;
            padding: 10px;
            border-radius: 40px;
            color: #ddd;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            font-family: 'Orbitron';
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #bc13fe;
            color: white;
            box-shadow: 0 0 12px #bc13fe;
        }
        .content-pane {
            display: none;
        }
        .content-pane.active {
            display: block;
        }
        label {
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #bc13fe;
            border-radius: 30px;
            color: white;
            margin-top: 5px;
            outline: none;
        }
        .custom-limit-container {
            display: none;
            margin-top: 5px;
        }
        .gen-btn {
            width: 100%;
            margin-top: 20px;
            background: linear-gradient(95deg, #9a0cd3, #bc13fe);
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .member-card {
            background: rgba(0,0,0,0.7);
            border: 1px solid #bc13fe;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .member-info {
            color: #ccc;
            font-size: 0.75rem;
        }
        .member-info b {
            color: white;
            font-size: 0.8rem;
        }
        .device-list {
            background: #0a0a0a;
            padding: 8px;
            border-radius: 12px;
            margin: 8px 0;
        }
        .device-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            padding: 4px 0;
        }
        .del-device {
            color: #ff8888;
            cursor: pointer;
        }
        .member-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }
        .member-actions i {
            cursor: pointer;
            font-size: 1rem;
        }
        .fa-pen { color: #facc15; }
        .fa-trash { color: #ff4d4d; }
        .result-msg {
            margin-top: 12px;
            color: #0f0;
            font-size: 0.7rem;
            text-align: center;
        }
        .tier-badge {
            background: rgba(188,19,254,0.3);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            margin-left: 6px;
        }
    </style>
</head>
<body>
<div class="admin-panel">
    <div class="header">
        <h2><i class="fas fa-cloud-upload-alt"></i> XK TEAM CLOUD</h2>
        <button class="logout-btn" id="logoutBtn">LOGOUT</button>
    </div>
    <div class="tabs">
        <div class="tab-btn" data-tab="module">MODULE</div>
        <div class="tab-btn" data-tab="apk">APK</div>
        <div class="tab-btn" data-tab="members">MEMBERS</div>
    </div>

    <!-- MODULE PANEL -->
    <div id="module-pane" class="content-pane">
        <label>DEVICE ID</label>
        <input type="text" id="modId" placeholder="Android ID Buyer...">
        <label>EXPIRED DATE</label>
        <input type="date" id="modExp">
        <label>DEVICE LIMIT</label>
        <select id="modLimitSelect">
            <option value="1">1 DEVICE</option>
            <option value="2">2 DEVICE</option>
            <option value="3">3 DEVICE</option>
            <option value="4">4 DEVICE</option>
            <option value="5">5 DEVICE</option>
            <option value="custom">Custom (masukkan angka)</option>
        </select>
        <div id="modCustomContainer" class="custom-limit-container">
            <label>Custom Device Limit</label>
            <input type="number" id="modCustomLimit" min="1" max="999" value="1">
        </div>
        <button class="gen-btn" id="genModuleBtn">GENERATE MODULE</button>
        <div id="modResult" class="result-msg"></div>
    </div>

    <!-- APK PANEL -->
    <div id="apk-pane" class="content-pane">
        <label>USERNAME APK</label>
        <input type="text" id="apkUser" placeholder="Buat Username...">
        <label>PASSWORD (kosongkan jika auto generate)</label>
        <input type="text" id="apkPass" placeholder="Password (opsional)">
        <label>TIER AKUN</label>
        <select id="apkTier">
            <option value="Basic">Basic</option>
            <option value="Ultra">Ultra</option>
            <option value="Vixo">Vixo</option>
            <option value="Delta">Delta</option>
            <option value="Sonic">Sonic</option>
            <option value="Lunar">Lunar</option>
            <option value="Athena">Athena</option>
            <option value="Privet">Privet</option>
        </select>
        <label>DEVICE LIMIT</label>
        <select id="apkLimitSelect">
            <option value="1">1 DEVICE</option>
            <option value="2">2 DEVICE</option>
            <option value="3">3 DEVICE</option>
            <option value="4">4 DEVICE</option>
            <option value="5">5 DEVICE</option>
            <option value="custom">Custom (masukkan angka)</option>
        </select>
        <div id="apkCustomContainer" class="custom-limit-container">
            <label>Custom Device Limit</label>
            <input type="number" id="apkCustomLimit" min="1" max="999" value="1">
        </div>
        <label>EXPIRED DATE</label>
        <input type="date" id="apkExp">
        <button class="gen-btn" id="genApkBtn">ADD APK ACCESS</button>
        <div id="apkResult" class="result-msg"></div>
    </div>

    <!-- MEMBERS PANEL -->
    <div id="members-pane" class="content-pane">
        <button id="refreshMembersBtn" style="background:#bc13fe; border:none; padding:6px 12px; border-radius:30px; color:white; margin-bottom:12px; cursor:pointer;"><i class="fas fa-sync-alt"></i> Refresh</button>
        <div id="memberList">Loading members...</div>
    </div>
</div>

<!-- MODAL EDIT -->
<div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#0f1a2f; border-radius:24px; padding:20px; width:90%; max-width:380px; border:1px solid #bc13fe;">
        <h3 style="color:white;">Edit Member</h3>
        <label>Username / ID</label>
        <input type="text" id="editUser" readonly style="background:#1e2a3a;">
        <label>Key</label>
        <input type="text" id="editKey">
        <label id="editPassLabel" style="display:none;">Password (APK)</label>
        <input type="text" id="editPass" style="display:none;">
        <label id="editTierLabel" style="display:none;">Tier (APK)</label>
        <select id="editTier" style="display:none;">
            <option>Basic</option><option>Ultra</option><option>Vixo</option><option>Delta</option>
            <option>Sonic</option><option>Lunar</option><option>Athena</option><option>Privet</option>
        </select>
        <label>Expired Date</label>
        <input type="date" id="editExp">
        <label>Device Limit</label>
        <select id="editLimit">
            <option value="1">1 DEVICE</option><option value="2">2 DEVICE</option><option value="3">3 DEVICE</option>
            <option value="4">4 DEVICE</option><option value="5">5 DEVICE</option><option value="999">UNLIMITED</option>
        </select>
        <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:20px;">
            <button id="saveEditBtn" style="background:#bc13fe; border:none; padding:8px 20px; border-radius:30px; color:white;">Save</button>
            <button id="closeModalBtn" style="background:#ff4d4d; border:none; padding:8px 20px; border-radius:30px; color:white;">Cancel</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ========== CEK LOGIN (WAJIB) ==========
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('logoutBtn').onclick = () => {
            localStorage.removeItem('admin_logged_in');
            window.location.href = 'login.html';
        };

        const DB_URL = "https://module-database-d76ed-default-rtdb.firebaseio.com/";

        // ========== TAB SWITCHING ==========
        const tabs = document.querySelectorAll('.tab-btn');
        const panes = {
            module: document.getElementById('module-pane'),
            apk: document.getElementById('apk-pane'),
            members: document.getElementById('members-pane')
        };
        function setActiveTab(tabId) {
            Object.values(panes).forEach(p => p.classList.remove('active'));
            panes[tabId].classList.add('active');
            tabs.forEach(btn => {
                if (btn.getAttribute('data-tab') === tabId) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (tabId === 'members') loadMembers();
        }
        tabs.forEach(btn => btn.onclick = () => setActiveTab(btn.getAttribute('data-tab')));
        setActiveTab('module');

        // Custom limit logic
        const modLimitSelect = document.getElementById('modLimitSelect');
        const modCustom = document.getElementById('modCustomContainer');
        modLimitSelect.onchange = () => modCustom.style.display = modLimitSelect.value === 'custom' ? 'block' : 'none';
        modCustom.style.display = 'none';
        const apkLimitSelect = document.getElementById('apkLimitSelect');
        const apkCustom = document.getElementById('apkCustomContainer');
        apkLimitSelect.onchange = () => apkCustom.style.display = apkLimitSelect.value === 'custom' ? 'block' : 'none';
        apkCustom.style.display = 'none';

        function showResult(divId, msg) {
            const div = document.getElementById(divId);
            div.innerHTML = msg;
            div.style.display = 'block';
            setTimeout(() => div.innerHTML = '', 4000);
        }

        // ========== GENERATE MODULE ==========
        document.getElementById('genModuleBtn').onclick = async () => {
            const id = document.getElementById('modId').value.trim();
            const exp = document.getElementById('modExp').value;
            let limit = parseInt(modLimitSelect.value);
            if (modLimitSelect.value === 'custom') {
                let custom = parseInt(document.getElementById('modCustomLimit').value);
                if (isNaN(custom) || custom < 1) { alert('Custom limit harus angka positif'); return; }
                limit = custom;
            }
            if (!id || !exp) { alert('Isi Device ID dan Expired!'); return; }
            const key = "XK-" + Math.random().toString(36).substring(2,8).toUpperCase();
            const data = { key, expired: exp, device_limit: limit, status: "active" };
            try {
                await fetch(`${DB_URL}users/${id}.json`, { method: 'PUT', body: JSON.stringify(data) });
                showResult('modResult', `✅ DONE! KEY: ${key}`);
                if (panes.members.classList.contains('active')) loadMembers();
            } catch(e) { alert('Database error!'); }
        };

        // ========== GENERATE APK ==========
        document.getElementById('genApkBtn').onclick = async () => {
            const username = document.getElementById('apkUser').value.trim();
            let password = document.getElementById('apkPass').value.trim();
            const exp = document.getElementById('apkExp').value;
            const tier = document.getElementById('apkTier').value;
            let limit = parseInt(apkLimitSelect.value);
            if (apkLimitSelect.value === 'custom') {
                let custom = parseInt(document.getElementById('apkCustomLimit').value);
                if (isNaN(custom) || custom < 1) { alert('Custom limit harus angka positif'); return; }
                limit = custom;
            }
            if (!username || !exp) { alert('Isi Username dan Expired!'); return; }
            if (password === "") password = Math.random().toString(36).substring(2,8).toUpperCase();
            const key = "APK-" + Math.random().toString(36).substring(2,8).toUpperCase();
            const data = { key, password, expired: exp, device_limit: limit, tier, devices: {}, status: "active" };
            try {
                await fetch(`${DB_URL}apk_access/${username}.json`, { method: 'PUT', body: JSON.stringify(data) });
                showResult('apkResult', `✅ DONE!<br>🔑 KEY: ${key}<br>🔒 PASS: ${password}<br>🏷️ TIER: ${tier}<br>📱 LIMIT: ${limit}`);
                if (panes.members.classList.contains('active')) loadMembers();
            } catch(e) { alert('Database error!'); }
        };

        // ========== LOAD MEMBERS (LENGKAP DENGAN DEVICE, TIER, EDIT) ==========
        async function loadMembers() {
            const listDiv = document.getElementById('memberList');
            listDiv.innerHTML = '<div style="color:white;">Loading members...</div>';
            try {
                const res = await fetch(`${DB_URL}.json`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                listDiv.innerHTML = '';
                let hasAny = false;

                // MODULE (users)
                if (data.users && typeof data.users === 'object') {
                    for (let id in data.users) {
                        hasAny = true;
                        const obj = data.users[id];
                        const card = document.createElement('div');
                        card.className = 'member-card';
                        card.innerHTML = `
                            <div class="member-info">
                                <b>🔧 ${escapeHtml(id)} (MODULE)</b><br>
                                🔑 KEY: ${escapeHtml(obj.key || '-')}<br>
                                📅 EXP: ${escapeHtml(obj.expired || '-')} | 📱 LIMIT: ${escapeHtml(obj.device_limit || '-')}
                            </div>
                            <div class="member-actions">
                                <i class="fas fa-pen" data-type="users" data-id="${escapeHtml(id)}" data-edit></i>
                                <i class="fas fa-trash" data-type="users" data-id="${escapeHtml(id)}" data-del></i>
                            </div>
                        `;
                        listDiv.appendChild(card);
                    }
                }
                // APK (apk_access)
                if (data.apk_access && typeof data.apk_access === 'object') {
                    for (let id in data.apk_access) {
                        hasAny = true;
                        const obj = data.apk_access[id];
                        let devicesHtml = '<div class="device-list"><strong>📱 Registered devices:</strong>';
                        if (obj.devices && Object.keys(obj.devices).length) {
                            for (let dev in obj.devices) {
                                devicesHtml += `<div class="device-item"><span>${escapeHtml(dev)}</span><span class="del-device" data-key="${escapeHtml(id)}" data-device="${escapeHtml(dev)}">🗑️</span></div>`;
                            }
                        } else {
                            devicesHtml += '<div><em>No devices registered</em></div>';
                        }
                        devicesHtml += '</div>';
                        const card = document.createElement('div');
                        card.className = 'member-card';
                        card.innerHTML = `
                            <div class="member-info">
                                <b>📱 ${escapeHtml(id)} (APK)</b> <span class="tier-badge">${escapeHtml(obj.tier || 'Basic')}</span><br>
                                🔑 KEY: ${escapeHtml(obj.key || '-')}<br>
                                ${obj.password ? `🔒 PASS: ${escapeHtml(obj.password)}<br>` : ''}
                                📅 EXP: ${escapeHtml(obj.expired || '-')} | 📱 LIMIT: ${escapeHtml(obj.device_limit || '-')}
                            </div>
                            ${devicesHtml}
                            <div class="member-actions">
                                <i class="fas fa-pen" data-type="apk_access" data-id="${escapeHtml(id)}" data-edit></i>
                                <i class="fas fa-trash" data-type="apk_access" data-id="${escapeHtml(id)}" data-del></i>
                            </div>
                        `;
                        listDiv.appendChild(card);
                    }
                }
                if (!hasAny) listDiv.innerHTML = '<div style="color:#aaa;">No members found</div>';

                // Delete device event
                document.querySelectorAll('.del-device').forEach(el => {
                    el.onclick = async (e) => {
                        e.stopPropagation();
                        const key = el.getAttribute('data-key');
                        const device = el.getAttribute('data-device');
                        if (confirm(`Hapus device ${device} dari akun ${key}?`)) {
                            await fetch(`${DB_URL}apk_access/${key}/devices/${device}.json`, { method: 'DELETE' });
                            loadMembers();
                        }
                    };
                });
