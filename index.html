<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XK TEAM CLOUD - PREMIUM ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700&family=Poppins:wght=300;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent-purple: #bc13fe; --lightning: #e0aaff; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100%;
            font-family: 'Poppins', sans-serif;
            display: flex; align-items: center; justify-content: center;
            background-image: url('garou.png'); 
            background-size: cover; background-position: center;
            background-attachment: fixed; background-color: #000;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2); z-index: -1;
        }

        .lightning-border {
            position: relative; padding: 2px; border-radius: 22px;
            background: transparent; overflow: hidden;
            width: 92%; max-width: 440px;
            z-index: 10;
        }

        .lightning-border::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, var(--accent-purple), var(--lightning), transparent 40%);
            animation: rotate 3s linear infinite;
            z-index: -1;
        }

        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .glass-container { 
            position: relative;
            background: rgba(15, 5, 25, 0.55); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px; border-radius: 20px; 
            border: 1px solid rgba(188, 19, 254, 0.4);
            z-index: 20;
        }

        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { font-family: 'Orbitron'; color: #fff; text-shadow: 0 0 10px var(--accent-purple); font-size: 16px; margin: 0; pointer-events: none; }
        
        .logout-btn {
            background: #ff4d4d; border: none; padding: 5px 12px; border-radius: 20px;
            color: white; font-weight: bold; cursor: pointer; font-size: 8px; font-family: 'Orbitron';
        }

        .tab-menu { display: flex; gap: 5px; margin-bottom: 15px; position: relative; z-index: 30; }
        .tab-btn {
            flex: 1; padding: 12px; border: 1px solid var(--accent-purple);
            background: rgba(0, 0, 0, 0.6); color: #fff; border-radius: 8px;
            cursor: pointer; font-family: 'Orbitron'; font-size: 9px;
            transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active { background: var(--accent-purple); box-shadow: 0 0 15px var(--accent-purple); }

        .form-section { display: none; text-align: left; }
        .form-section.active { display: block; }

        label { color: #fff; font-size: 9px; font-weight: bold; display: block; margin-top: 10px; }
        input, select { 
            width: 100%; padding: 11px; margin: 4px 0 10px 0; border-radius: 8px; 
            border: 1px solid rgba(188, 19, 254, 0.5); 
            background: rgba(0, 0, 0, 0.75); color: #fff; box-sizing: border-box; outline: none;
            font-size: 11px;
        }
        .custom-limit-box { display: none; }

        .gen-btn { 
            width: 100%; padding: 14px; background: var(--accent-purple);
            color: white; border: none; border-radius: 8px; 
            font-family: 'Orbitron'; font-weight: bold; cursor: pointer;
            margin-top: 10px; box-shadow: 0 0 10px rgba(188, 19, 254, 0.4);
        }

        .member-card {
            background: rgba(0, 0, 0, 0.65); border: 1px solid rgba(188, 19, 254, 0.3);
            border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            position: relative; z-index: 30;
        }
        .member-card.selected { border-color: #bc13fe; background: rgba(188, 19, 254, 0.15); }
        .member-info b { color: #fff; font-size: 12px; }
        .member-info p { margin: 2px 0 0 0; font-size: 9px; color: #ccc; line-height: 1.4; }
        
        .badge-type { font-weight: bold; font-family: 'Orbitron'; font-size: 8px; margin-right: 3px; }
        .b-mod { color: #38bdf8; } .b-apk { color: #f43f5e; }
        
        .badge-tier { font-size: 7px; padding: 1px 5px; border-radius: 10px; border: 1px solid currentColor; font-weight: bold; margin-left: 5px; text-transform: uppercase; }
        .t-basic { color: #aaa; } .t-ultra { color: #06b6d4; } .t-vixo { color: #10b981; } .t-delta { color: #f97316; }
        .t-sonic { color: #eab308; } .t-lunar { color: #fff; } .t-athena { color: #ef4444; } .t-privet { color: #f59e0b; }

        .action-controls { display: none; gap: 12px; }
        .member-card.selected .action-controls { display: flex; }
        .icon-btn { cursor: pointer; font-size: 14px; padding: 4px; transition: 0.2s; }
        .icon-edit { color: #facc15; } .icon-trash { color: #ff4d4d; }

        #result { display:none; margin-top:15px; color:#00ff00; font-family:'Orbitron'; font-size:11px; font-weight:bold; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="lightning-border">
        <div class="glass-container">
            <div class="header-area">
                <h2>XK TEAM CLOUD</h2>
                <button class="logout-btn" onclick="logout()">LOGOUT</button>
            </div>
            
            <div class="tab-menu">
                <button class="tab-btn active" id="btn-module" onclick="openTab(event, 'module')">MODULE</button>
                <button class="tab-btn" id="btn-apk" onclick="openTab(event, 'apk')">APK</button>
                <button class="tab-btn" id="btn-members" onclick="openTab(event, 'members'); loadMembers();">MEMBERS</button>
            </div>

            <div id="module" class="form-section active">
                <label>DEVICE ID</label>
                <input type="text" id="modId" placeholder="Android ID Buyer...">
                <label>EXPIRED DATE</label>
                <input type="date" id="modExp">
                <label>DEVICE LIMIT</label>
                <select id="modLimit" onchange="toggleCustomLimit('mod')">
                    <option value="1">1 DEVICE</option>
                    <option value="2">2 DEVICE</option>
                    <option value="5">5 DEVICE</option>
                    <option value="custom">CUSTOM LIMIT</option>
                </select>
                <div id="modCustomDiv" class="custom-limit-box">
                    <label>INPUT CUSTOM LIMIT</label>
                    <input type="number" id="modCustomLimit" value="1" min="1">
                </div>
                <button class="gen-btn" onclick="generate('module')">GENERATE MODULE</button>
            </div>

            <div id="apk" class="form-section">
                <label>USERNAME APK</label>
                <input type="text" id="apkId" placeholder="Buat Username...">
                <label>PASSWORD (Kosong = Auto)</label>
                <input type="text" id="apkPass" placeholder="Password akun...">
                <label>TIER AKUN</label>
                <select id="apkTier">
                    <option value="basic">Basic</option>
                    <option value="ultra">Ultra</option>
                    <option value="vixo">Vixo</option>
                    <option value="delta">Delta</option>
                    <option value="sonic">Sonic</option>
                    <option value="lunar">Lunar</option>
                    <option value="athena">Athena</option>
                    <option value="privet">Athena Privet</option>
                </select>
                <label>DEVICE LIMIT</label>
                <select id="apkLimit" onchange="toggleCustomLimit('apk')">
                    <option value="1">1 DEVICE</option>
                    <option value="2">2 DEVICE</option>
                    <option value="5">5 DEVICE</option>
                    <option value="custom">CUSTOM LIMIT</option>
                </select>
                <div id="apkCustomDiv" class="custom-limit-box">
                    <label>INPUT CUSTOM LIMIT</label>
                    <input type="number" id="apkCustomLimit" value="1" min="1">
                </div>
                <label>EXPIRED DATE</label>
                <input type="date" id="apkExp">
                <button class="gen-btn" onclick="generate('apk')">ADD APK ACCESS</button>
            </div>

            <div id="members" class="form-section">
                <div id="memberList" style="max-height: 280px; overflow-y: auto; padding-right: 5px;"></div>
            </div>

            <div id="result"></div>
        </div>
    </div>

    <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:rgba(20, 10, 30, 0.95); border-radius:15px; padding:20px; width:85%; max-width:360px; border:1px solid #bc13fe; text-align: left;">
            <h3 style="color:white; font-family:'Orbitron'; font-size:14px; margin-bottom:15px; text-align:center;" id="modalTitle">EDIT ACCESS</h3>
            <input type="hidden" id="editType">
            <input type="hidden" id="editTargetId">
            
            <label>ACCESS KEY</label>
            <input type="text" id="editKey">
            
            <div id="apkEditOnly" style="display:none;">
                <label>PASSWORD</label>
                <input type="text" id="editPass">
                <label>TIER AKUN</label>
                <select id="editTier">
                    <option value="basic">Basic</option>
                    <option value="ultra">Ultra</option>
                    <option value="vixo">Vixo</option>
                    <option value="delta">Delta</option>
                    <option value="sonic">Sonic</option>
                    <option value="lunar">Lunar</option>
                    <option value="athena">Athena</option>
                    <option value="privet">Athena Privet</option>
                </select>
            </div>
            
            <label>EXPIRED DATE</label>
            <input type="date" id="editExp">
            <label>DEVICE LIMIT</label>
            <input type="number" id="editLimit" min="1">
            
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button onclick="saveEdit()" style="flex:1; background:#bc13fe; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; font-family:'Orbitron'; font-size:11px;">SAVE</button>
                <button onclick="closeModal()" style="flex:1; background:#ff4d4d; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; font-family:'Orbitron'; font-size:11px;">CANCEL</button>
            </div>
        </div>
    </div>

<script>
    const DB_URL = "https://module-database-d76ed-default-rtdb.firebaseio.com/";

    // FIX UTAMA: Menyisipkan parameter 'e' (event) biar currentTarget aman terkendali
    function openTab(e, name) {
        document.querySelectorAll('.form-section').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(name).style.display = 'block';
        e.currentTarget.classList.add('active');
        document.getElementById('result').style.display = 'none';
    }

    function toggleCustomLimit(type) {
        const selectVal = document.getElementById(type + 'Limit').value;
        document.getElementById(type + 'CustomDiv').style.display = (selectVal === 'custom') ? 'block' : 'none';
    }

    function logout() {
        localStorage.removeItem('admin_logged_in');
        window.location.href = 'login.html';
    }

    async function generate(type) {
        const idInput = type === 'module' ? 'modId' : 'apkId';
        const expInput = type === 'module' ? 'modExp' : 'apkExp';
        
        const id = document.getElementById(idInput).value.trim();
        const exp = document.getElementById(expInput).value;
        
        if(!id || !exp) { alert("Harap isi semua kolom!"); return; }

        let limit = "1";
        if (type === 'module') {
            const choose = document.getElementById('modLimit').value;
            limit = choose === 'custom' ? document.getElementById('modCustomLimit').value : choose;
        } else {
            const choose = document.getElementById('apkLimit').value;
            limit = choose === 'custom' ? document.getElementById('apkCustomLimit').value : choose;
        }

        const key = type === 'module' ? "XK-" + Math.random().toString(36).substring(2, 8).toUpperCase() : "APK-" + Math.random().toString(36).substring(2, 8).toUpperCase();
        const path = type === 'module' ? `users/${id}` : `apk_access/${id}`;
        
        let data = { 
            key: key, 
            expired: exp,
            device_limit: limit,
            status: "active"
        };

        if (type === 'apk') {
            let pass = document.getElementById('apkPass').value.trim();
            if (pass === "") pass = Math.random().toString(36).substring(2, 7).toUpperCase();
            data.password = pass;
            data.tier = document.getElementById('apkTier').value;
        }
        
        try {
            await fetch(`${DB_URL}${path}.json`, { method: 'PUT', body: JSON.stringify(data) });
            const resDiv = document.getElementById('result');
            resDiv.style.display = 'block';
            resDiv.innerHTML = type === 'module' ? `DONE! KEY: ${key}` : `DONE!<br>KEY: ${key}<br>PASS: ${data.password}`;
            document.getElementById(idInput).value = '';
            if(type === 'apk') document.getElementById('apkPass').value = '';
        } catch(e) { alert("Database Error!"); }
    }

    async function loadMembers() {
        const listDiv = document.getElementById('memberList');
        listDiv.innerHTML = '<p style="text-align:center; color:#fff; font-size:10px;">Loading data...</p>';
        
        try {
            const res = await fetch(`${DB_URL}.json`);
            const data = await res.json();
            listDiv.innerHTML = '';

            if (data.users) {
                for (let id in data.users) {
                    createCard(id, data.users[id], 'users', listDiv);
                }
            }
            if (data.apk_access) {
                for (let id in data.apk_access) {
                    createCard(id, data.apk_access[id], 'apk_access', listDiv);
                }
            }
            if (!data.users && !data.apk_access) {
                listDiv.innerHTML = '<p style="text-align:center; color:#aaa; font-size:10px;">Database Kosong.</p>';
            }
        } catch (e) { listDiv.innerHTML = '<p style="color:red; text-align:center; font-size:10px;">Failed sync.</p>'; }
    }

    function createCard(id, obj, type, parent) {
        const card = document.createElement('div');
        card.className = 'member-card';
        card.onclick = () => {
            document.querySelectorAll('.member-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
        };

        const isMod = type === 'users';
        const badgeHTML = isMod ? '<span class="badge-type b-mod">[MOD]</span>' : '<span class="badge-type b-apk">[APK]</span>';
        const tierHTML = isMod ? '' : `<span class="badge-tier t-${obj.tier || 'basic'}">${obj.tier || 'basic'}</span>`;
        const passHTML = isMod ? '' : ` | PASS: ${obj.password || '-'}`;

        card.innerHTML = `
            <div class="member-info">
                ${badgeHTML} <b>${id}</b> ${tierHTML}
                <p>KEY: ${obj.key || '-'} ${passHTML}</p>
                <p>EXP: ${obj.expired || '-'} | LIMIT: ${obj.device_limit || '1'}</p>
            </div>
            <div class="action-controls">
                <div class="icon-btn icon-edit" onclick="openEditModal(event, '${type}', '${id}')">
                    <i class="fas fa-edit"></i>
                </div>
                <div class="icon-btn icon-trash" onclick="deleteMember(event, '${type}', '${id}')">
                    <i class="fas fa-trash-alt"></i>
                </div>
            </div>`;
        parent.appendChild(card);
    }

    async function deleteMember(event, type, id) {
        event.stopPropagation();
        if(confirm(`Hapus akses ${id}?`)) {
            await fetch(`${DB_URL}${type}/${id}.json`, { method: 'DELETE' });
            loadMembers();
        }
    }

    async function openEditModal(event, type, id) {
        event.stopPropagation();
        try {
            const res = await fetch(`${DB_URL}${type}/${id}.json`);
            const obj = await res.json();
            if(!obj) return;

            document.getElementById('editType').value = type;
            document.getElementById('editTargetId').value = id;
            document.getElementById('editKey').value = obj.key || '';
            document.getElementById('editExp').value = obj.expired || '';
            document.getElementById('editLimit').value = obj.device_limit || '1';

            const apkOnlySection = document.getElementById('apkEditOnly');
            if (type === 'apk_access') {
                apkOnlySection.style.display = 'block';
                document.getElementById('editPass').value = obj.password || '';
                document.getElementById('editTier').value = obj.tier || 'basic';
                document.getElementById('modalTitle').innerText = "EDIT APK ACCESS";
            } else {
                apkOnlySection.style.display = 'none';
                document.getElementById('modalTitle').innerText = "EDIT MODULE MEMBER";
            }

            document.getElementById('editModal').style.display = 'flex';
        } catch(e) { alert("Gagal mengambil data detail!"); }
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    async function saveEdit() {
        const type = document.getElementById('editType').value;
        const id = document.getElementById('editTargetId').value;
        
        let data = {
            key: document.getElementById('editKey').value.trim(),
            expired: document.getElementById('editExp').value,
            device_limit: document.getElementById('editLimit').value,
            status: "active"
        };

        if (type === 'apk_access') {
            data.password = document.getElementById('editPass').value.trim();
            data.tier = document.getElementById('editTier').value;
        }

        try {
            await fetch(`${DB_URL}${type}/${id}.json`, { method: 'PUT', body: JSON.stringify(data) });
            closeModal();
            loadMembers();
        } catch(e) { alert("Gagal menyimpan perubahan!"); }
    }
</script>
</body>
</html>
