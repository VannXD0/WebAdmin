<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>XK TEAM · Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0A0F1E, #03060C);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: url('garou.png');
            background-size: cover;
            background-position: center;
        }
        .login-card {
            background: rgba(12,20,35,0.75);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid #bc13fe;
            box-shadow: 0 0 30px rgba(188,19,254,0.2);
            text-align: center;
        }
        .login-card i { font-size: 3rem; color: #bc13fe; margin-bottom: 1rem; }
        .login-card h2 { font-family: 'Orbitron'; color: white; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.2rem; position: relative; }
        .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1rem; }
        .input-group input {
            width: 100%; padding: 12px 16px 12px 44px; background: rgba(0,0,0,0.6);
            border: 1px solid #bc13fe; border-radius: 30px; color: white; outline: none;
        }
        .login-btn {
            width: 100%; background: linear-gradient(95deg, #9a0cd3, #bc13fe);
            border: none; padding: 12px; border-radius: 30px; color: white;
            font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .error-msg { color: #ff8888; font-size: 0.8rem; margin-top: 10px; display: none; }
        .help-text { color: #aaa; font-size: 0.7rem; margin-top: 1rem; }
    </style>
</head>
<body>
<div class="login-card">
    <i class="fas fa-user-shield"></i>
    <h2>ADMIN LOGIN</h2>
    <div class="input-group"><i class="fas fa-user"></i><input type="text" id="username" placeholder="Username"></div>
    <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Password"></div>
    <button class="login-btn" id="loginBtn">MASUK</button>
    <div id="errorMsg" class="error-msg"></div>
    <div class="help-text">Hubungi administrator untuk akun</div>
</div>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-database-compat.js"></script>
<script>
    const DB_URL = "https://admin-login-ab66b-default-rtdb.firebaseio.com/";
    const loginBtn = document.getElementById('loginBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorDiv = document.getElementById('errorMsg');
    loginBtn.onclick = async () => {
        const user = usernameInput.value.trim();
        const pass = passwordInput.value;
        if (!user || !pass) { errorDiv.innerText = 'Isi semua!'; errorDiv.style.display = 'block'; return; }
        try {
            const res = await fetch(`${DB_URL}users/${user}.json`);
            const data = await res.json();
            if (!data) { errorDiv.innerText = 'User tidak ditemukan'; errorDiv.style.display = 'block'; return; }
            if (data.password !== pass) { errorDiv.innerText = 'Password salah'; errorDiv.style.display = 'block'; return; }
            localStorage.setItem('admin_logged_in', 'true');
            window.location.href = 'index.html';
        } catch(e) { errorDiv.innerText = 'Koneksi gagal'; errorDiv.style.display = 'block'; }
    };
</script>
</body>
</html>
