<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login Admin • XK TEAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0A0F1E, #03060C);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(12, 20, 35, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid #bc13fe;
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.2);
            transition: 0.2s;
        }
        .login-card:hover {
            transform: translateY(-3px);
            border-color: #bc13fe;
            box-shadow: 0 0 45px rgba(188, 19, 254, 0.3);
        }
        .brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .brand-icon {
            font-size: 3rem;
            color: #bc13fe;
            text-shadow: 0 0 15px #bc13fe;
            margin-bottom: 0.5rem;
        }
        .brand h2 {
            font-family: 'Orbitron';
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e0aaff, #bc13fe);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .brand p {
            color: #b0a0c0;
            font-size: 0.75rem;
            margin-top: 0.2rem;
        }
        .input-group {
            margin-bottom: 1.2rem;
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #bc13fe;
            font-size: 1rem;
        }
        .input-group input {
            width: 100%;
            background: rgba(0,0,0,0.6);
            border: 1px solid #5a2a8a;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border-radius: 3rem;
            font-size: 0.9rem;
            color: #f0f0f0;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #bc13fe;
            box-shadow: 0 0 0 3px rgba(188,19,254,0.3);
            background: rgba(0,0,0,0.8);
        }
        .input-group input::placeholder {
            color: #7a6a9a;
            font-size: 0.8rem;
        }
        .login-btn {
            background: linear-gradient(95deg, #9a0cd3, #bc13fe);
            width: 100%;
            border: none;
            padding: 0.85rem;
            border-radius: 3rem;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 0.5rem;
            box-shadow: 0 5px 15px rgba(188,19,254,0.3);
        }
        .login-btn:hover {
            background: linear-gradient(95deg, #7b0aa8, #9a0cd3);
            transform: scale(0.98);
        }
        .error-msg {
            background: rgba(255,70,70,0.15);
            border-left: 4px solid #ff4d4d;
            padding: 0.6rem 1rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            margin-top: 1rem;
            color: #ffb0b0;
            display: none;
            text-align: center;
        }
        .error-msg.show {
            display: block;
            animation: fade 0.3s;
        }
        .help-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .help-link a {
            color: #b87cff;
            text-decoration: none;
            font-size: 0.7rem;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-user-shield"></i></div>
            <h2>ADMIN PANEL</h2>
            <p>XK TEAM · Authentication</p>
        </div>
        <div id="errorMsg" class="error-msg">⚠️ Username atau password salah</div>
        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="Username" autocomplete="off" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn"><i class="fas fa-arrow-right-to-bracket"></i> MASUK</button>
        </form>
        <div class="help-link">
            <a href="#" id="helpBtn"><i class="fas fa-question-circle"></i> Butuh bantuan?</a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-database-compat.js"></script>
    <script>
        // Konfigurasi Database Admin Anda
        const DB_URL = "https://admin-login-ab66b-default-rtdb.firebaseio.com/";
        
        // Inisialisasi Firebase manual (tanpa perlu konfigurasi app)
        // Kita akan fetch langsung ke REST API agar lebih simpel
        const loginBtn = document.getElementById('loginBtn') || document.querySelector('.login-btn');
        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('❌ Isi semua kolom!');
                return;
            }

            // Tampilkan loading di tombol
            const btn = form.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Memeriksa...';
            btn.disabled = true;

            try {
                // Ambil data user dari Firebase Realtime Database
                const response = await fetch(`${DB_URL}users/${username}.json`);
                if (!response.ok) throw new Error('Gagal mengambil data');
                const userData = await response.json();

                if (!userData) {
                    showError('❌ Username tidak ditemukan');
                    return;
                }

                // Bandingkan password
                if (userData.password !== password) {
                    showError('❌ Password salah');
                    return;
                }

                // Login sukses
                // Simpan flag session (bisa juga pakai localStorage)
                localStorage.setItem('admin_logged_in', 'true');
                // Redirect ke halaman admin panel
                window.location.href = 'index.html';
            } catch (err) {
                console.error(err);
                showError('⚠️ Gagal terhubung ke database. Periksa koneksi atau aturan keamanan.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        function showError(msg) {
            errorDiv.innerText = msg;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 3000);
        }

        document.getElementById('helpBtn').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Hubungi admin XK TEAM untuk bantuan.');
        });
    </script>
</body>
</html>
